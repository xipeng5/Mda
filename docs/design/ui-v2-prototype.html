/* ════════ 跨 SO 调用图谱（真实 libbase.so ↔ liblog.so 边） ════════ */
function renderGraphView(fn) {
  const gdata = MDA_DATA.crossGraph;
  // 以当前函数或最近的跨 SO 核心节点为中心，展示真实三层 + 跨模块分组
  const curId = fnKey(state.so, fn.addr);
  const callers = gdata.edges.filter((e) => e.to === curId).map((e) => gdata.nodes[e.from]).filter(Boolean);
  const callees = gdata.edges.filter((e) => e.from === curId).map((e) => gdata.nodes[e.to]).filter(Boolean);

  // 如果当前函数本身孤立，展示全会话真实跨 SO 调用拓扑总览（libbase.so -> liblog.so）
  const showOverview = callers.length === 0 && callees.length === 0;
  let leftNodes, midNodes, rightNodes, drawEdges = [];

  if (showOverview) {
    const crossEdges = gdata.edges.filter((e) => e.cross).slice(0, 10);
    const lMap = new Map(), rMap = new Map();
    crossEdges.forEach((e) => {
      if (gdata.nodes[e.from]) lMap.set(e.from, gdata.nodes[e.from]);
      if (gdata.nodes[e.to]) rMap.set(e.to, gdata.nodes[e.to]);
    });
    leftNodes = [...lMap.values()];
    midNodes = [];
    rightNodes = [...rMap.values()];
    drawEdges = crossEdges;
  } else {
    leftNodes = callers.slice(0, 10);
    midNodes = [{ id: curId, so: state.so, addr: fn.addr, name: displayName(state.so, fn) }];
    rightNodes = callees.slice(0, 10);
    drawEdges = [
      ...leftNodes.map((n) => ({ from: n.id, to: curId, cross: n.so !== state.so })),
      ...rightNodes.map((n) => ({ from: curId, to: n.id, cross: n.so !== state.so }))
    ];
  }

  const NW = 236, NH = 48, ROW_H = 62;
  const coords = new Map();
  const placeCol = (arr, x) => {
    const startY = Math.max(48, 250 - (arr.length * ROW_H) / 2);
    arr.forEach((n, i) => coords.set(n.id, { x, y: startY + i * ROW_H, n }));
  };
  if (showOverview) {
    placeCol(leftNodes, 80);
    placeCol(rightNodes, 560);
  } else {
    placeCol(leftNodes, 40);
    placeCol(midNodes, 355);
    placeCol(rightNodes, 670);
  }

  let edgesSvg = "";
  drawEdges.forEach((e) => {
    const a = coords.get(e.from), b = coords.get(e.to);
    if (!a || !b) return;
    const x1 = a.x + NW, y1 = a.y + NH / 2;
    const x2 = b.x, y2 = b.y + NH / 2;
    const mx = (x1 + x2) / 2;
    const col = e.cross ? "var(--violet)" : "var(--accent)";
    edgesSvg += `<path d="M ${x1} ${y1} C ${mx} ${y1}, ${mx} ${y2}, ${x2} ${y2}"
      fill="none" stroke="${col}" stroke-width="${e.cross ? 2 : 1.5}"
      stroke-dasharray="${e.cross ? "6 3" : "none"}" stroke-opacity="0.85"
      marker-end="${e.cross ? "url(#gArrViolet)" : "url(#gArrBlue)"}"/>`;
  });

  let nodesSvg = "";
  coords.forEach((p, id) => {
    const isCenter = id === curId;
    const isCross = p.n.so !== state.so;
    const shortName = p.n.name.length > 26 ? p.n.name.slice(0, 25) + "…" : p.n.name;
    nodesSvg += `<g class="xnode${isCenter ? " center" : ""}${isCross ? " cross" : ""}" data-so="${esc(p.n.so)}" data-addr="${p.n.addr}">
      <title>${esc(p.n.so)}!${esc(p.n.name)} @ ${hex(p.n.addr)}</title>
      <rect x="${p.x}" y="${p.y}" width="${NW}" height="${NH}"/>
      <circle cx="${p.x + 14}" cy="${p.y + 18}" r="4" fill="${modColor(p.n.so)}"/>
      <text x="${p.x + 24}" y="${p.y + 21}" fill="var(--fg)" font-family="var(--mono)" font-size="11.5" font-weight="600">${esc(shortName)}</text>
      <text x="${p.x + 24}" y="${p.y + 38}" fill="var(--fg-3)" font-family="var(--mono)" font-size="10.5">${esc(p.n.so)} · ${hex(p.n.addr)}</text>
    </g>`;
  });

  const vp = state.canvas.graph;
  $("stageBody").innerHTML = `
    <div class="canvas-view" id="graphCanvas">
      <div class="canvas-tools">
        <button class="icon-btn" id="gZoomIn" title="放大"><svg class="ic" viewBox="0 0 16 16"><path d="M8 3.5v9M3.5 8h9"/></svg></button>
        <button class="icon-btn" id="gZoomOut" title="缩小"><svg class="ic" viewBox="0 0 16 16"><path d="M3.5 8h9"/></svg></button>
        <button class="icon-btn" id="gReset" title="重置视图"><svg class="ic" viewBox="0 0 16 16"><path d="M3 8a5 5 0 1 0 1.5-3.5L3 6m0-3v3h3"/></svg></button>
      </div>
      <div class="canvas-legend">
        <span><i class="leg-dot" style="background:var(--accent)"></i>liblog.so（同模块边）</span>
        <span><i class="leg-dot" style="background:var(--violet)"></i>libbase.so（跨 SO PLT→导出边）</span>
        <span style="color:var(--fg-3)">${showOverview ? "当前函数无直接图谱边，已自动展示真实跨 SO 拓扑总览" : "点击任意节点重新聚焦，双击进入反汇编"}</span>
      </div>
      <svg class="canvas-svg" id="graphSvg">
        <defs>
          <marker id="gArrBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L8 5L0 9z" fill="var(--accent)"/></marker>
          <marker id="gArrViolet" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L8 5L0 9z" fill="var(--violet)"/></marker>
        </defs>
        <g id="graphViewport" transform="translate(${vp.x},${vp.y}) scale(${vp.scale})">${edgesSvg}${nodesSvg}</g>
      </svg>
    </div>`;

  setupPanZoom("graphCanvas", "graphViewport", "graph", "gZoomIn", "gZoomOut", "gReset");
  $("graphSvg").querySelectorAll(".xnode").forEach((g) => {
    g.onclick = () => jumpTo(g.dataset.so, Number(g.dataset.addr));
    g.ondblclick = () => {
      state.mode = "split";
      jumpTo(g.dataset.so, Number(g.dataset.addr));
    };
  });
}

let panZoomAbort = null;
function fitCanvas(wrapId, vpId, key) {
  const wrap = $(wrapId), vp = $(vpId);
  if (!wrap || !vp) return;
  try {
    const bb = vp.getBBox();
    const cw = wrap.clientWidth || 760;
    const ch = wrap.clientHeight || 460;
    if (bb.width > 0 && bb.height > 0) {
      const pad = 42;
      const scale = Math.max(0.45, Math.min(1.05, Math.min((cw - pad * 2) / bb.width, (ch - pad * 2) / bb.height)));
      const x = Math.round((cw - bb.width * scale) / 2 - bb.x * scale);
      const y = Math.round(Math.max(24, (ch - bb.height * scale) / 2) - bb.y * scale);
      state.canvas[key] = { x, y, scale };
      vp.setAttribute("transform", `translate(${x},${y}) scale(${scale})`);
    }
  } catch (_) {}
}

function setupPanZoom(wrapId, vpId, key, inId, outId, resetId) {
  // 清理上一次画布绑定，防止切换视图时泄漏 window 监听器
  if (panZoomAbort) panZoomAbort.abort();
  panZoomAbort = new AbortController();
  const sig = panZoomAbort.signal;

  const wrap = $(wrapId);
  const vp = $(vpId);
  const apply = () => {
    const c = state.canvas[key];
    vp.setAttribute("transform", `translate(${c.x},${c.y}) scale(${c.scale})`);
  };
  fitCanvas(wrapId, vpId, key);

  let dragging = false, sx = 0, sy = 0, ox = 0, oy = 0;
  wrap.onmousedown = (e) => {
    if (e.target.closest(".cfg-block,.xnode,.canvas-tools")) return;
    dragging = true; sx = e.clientX; sy = e.clientY;
    ox = state.canvas[key].x; oy = state.canvas[key].y;
  };
  window.addEventListener("mousemove", (e) => {
    if (!dragging) return;
    state.canvas[key].x = ox + (e.clientX - sx);
    state.canvas[key].y = oy + (e.clientY - sy);
    apply();
  }, { signal: sig });
  window.addEventListener("mouseup", () => { dragging = false; }, { signal: sig });
  wrap.onwheel = (e) => {
    e.preventDefault();
    const factor = e.deltaY < 0 ? 1.12 : 0.89;
    state.canvas[key].scale = Math.max(0.35, Math.min(2.2, state.canvas[key].scale * factor));
    apply();
  };
  $(inId).onclick = () => { state.canvas[key].scale = Math.min(2.2, state.canvas[key].scale * 1.18); apply(); };
  $(outId).onclick = () => { state.canvas[key].scale = Math.max(0.35, state.canvas[key].scale * 0.84); apply(); };
  $(resetId).onclick = () => fitCanvas(wrapId, vpId, key);
}

/* ════════ 工具分类、137 工具目录与 AI 操控设备动画特效系统 ════════ */
function classifyTool(tool) {
  const t = tool || "";
  if (/^ui_/.test(t)) return "ui";
  if (/^vm_|^dump_vm|^probe_vm|^find_vm_|^find_dispatch/.test(t)) return "vm";
  if (/^perf_watch|^uprobe_/.test(t)) return "watch";
  if (/^java_/.test(t)) return "java";
  if (/^trace_|^watch_module|^module_load/.test(t)) return "trace";
  if (/^mem_/.test(t)) return "mem";
  if (/^behavior_/.test(t)) return "behavior";
  if (/process|^list_threads|^probe_network|^list_devices|^start_frida|^frida_/.test(t)) return "proc";
  if (/breakpoint|^hits$|^wait_hits|^poll_events|^probe_hits|^resume$|^freeze|^unfreeze|^attach|^detach/.test(t)) return "bp";
  if (/^read_|^locate_|^get_callstack|^runtime_modules|^list_modules|^dump_so/.test(t)) return "runtime";
  if (/^plugin_/.test(t)) return "plugin";
  return "static";
}

const TOOL_LABEL = {
  static: "静态", plugin: "插件", vm: "VM", bp: "断点", proc: "进程",
  behavior: "行为", mem: "内存", watch: "观察点", trace: "轨迹",
  java: "Java", runtime: "运行时", ui: "UI"
};

const TOOL_COLOR = {
  static: "#4c8dff", plugin: "#a78bfa", vm: "#22d3ee", bp: "#fb7185",
  proc: "#34d399", behavior: "#a78bfa", mem: "#fbbf24", watch: "#fb7185",
  trace: "#34d399", java: "#38bdf8", runtime: "#fbbf24", ui: "#38bdf8"
};

// 映射到右侧 Android 孪生真机的 4 个真实层级（0: UI/Java/Hook · 1: 进程/线程 · 2: Native SO/内存/VM · 3: Kernel/断点）
function toolToLayer(tool, cat) {
  if (/freeze|process|list_devices|threads|network|start_frida|attach|detach/.test(tool)) return 1;
  if (cat === "ui" || cat === "java" || cat === "behavior") return 0;
  if (cat === "bp" || cat === "watch") return 3;
  if (cat === "proc" || cat === "trace") return 1;
  return 2;
}

const LAYER_NAMES = ["UI / Java / Hook 层", "进程 & 线程层", "Native SO / 内存层", "Kernel / 断点层"];
const HOOK_NAMES = ["MessageDigest", "Cipher", "Mac", "FileIn", "FileOut", "Activity", "Assets", "Socket"];

function isReadbackTool(tool) {
  return /read_|mem_|dump_|list_|decompile|disassemble|callers_of|call_chain|hits|scan|profile|infer|plugin_run/.test(tool || "");
}

function initLiveStream() {
  state.liveEvents = [];
  state.toolCounts = {};
  state.nextEventId = 1;
  // 按最新在前载入本次从真实样本提取录制的事件
  const src = (MDA_DATA.recordedEvents || []).slice();
  src.forEach((ev) => {
    const id = state.nextEventId++;
    const cat = ev.kind === "plugin" ? "plugin" : classifyTool(ev.tool);
    state.liveEvents.unshift({
      id,
      tool: ev.tool,
      cat,
      args: ev.args || {},
      ms: ev.ms,
      ts: ev.ts,
      summary: ev.summary,
      resultPreview: ev.resultPreview,
      jumpSo: ev.jumpSo,
      jumpAddr: ev.jumpAddr,
      isPreview: false
    });
    state.toolCounts[ev.tool] = (state.toolCounts[ev.tool] || 0) + 1;
  });
  state.selectedEventId = state.liveEvents[0]?.id || 1;
}

let beamTimer = null, hudTimer = null, opsFiringTimer = null, freezeTimer = null;

function triggerBeamAndHud(ev, col, layerIdx) {
  // 1. 顶部能量流光条
  const beam = $("aiBeam");
  if (beam) {
    beam.style.setProperty("--beam-col", col);
    beam.classList.add("on");
    clearTimeout(beamTimer);
    beamTimer = setTimeout(() => beam.classList.remove("on"), 1550);
  }
  // 2. 热力条雷达光柱扫描
  const sweep = $("heatSweep");
  if (sweep) {
    sweep.classList.remove("go");
    void sweep.offsetWidth;
    sweep.classList.add("go");
  }
  // 3. 舞台边框语义光晕（冻结冰蓝 / 断点玫红 / Hook 紫罗兰）
  const stage = $("stageBody");
  if (stage) {
    stage.classList.remove("aura-freeze", "aura-hit", "aura-hook");
    void stage.offsetWidth;
    if (/freeze/.test(ev.tool)) stage.classList.add("aura-freeze");
    else if (ev.cat === "bp" || /breakpoint|hits/.test(ev.tool)) stage.classList.add("aura-hit");
    else if (ev.cat === "behavior") stage.classList.add("aura-hook");
  }
  // 4. 若当前不在工具流视图，自动浮出右下角迷你 AI 操控雷达 HUD
  const hud = $("deviceHud");
  if (hud && state.mode !== "live") {
    hud.style.setProperty("--hud-col", col);
    $("hudTool").textContent = ev.tool;
    $("hudBadge").textContent = TOOL_LABEL[ev.cat] || ev.cat;
    $("hudBadge").className = "ev-badge " + ev.cat;
    $("hudSub").textContent = ev.summary;
    $("hudLayer").textContent = LAYER_NAMES[layerIdx].replace(/ 层$/, "");
    hud.classList.add("show");
    clearTimeout(hudTimer);
    hudTimer = setTimeout(() => hud.classList.remove("show"), 2600);
  } else if (hud) {
    hud.classList.remove("show");
  }
}

// 60fps SVG 路径光粒子束发射器（从 AI 神经核沿贝塞尔曲线疾驰到 Android 目标层，支持双向回传粒子 + 落点雷达波纹）
function animateConduitPulse(layerIdx, col, withReturn, toolName) {
  const svg = $("opsSvg");
  const fxGroup = $("opsFxGroup");
  const pathEl = $("conduitPath" + layerIdx);
  const beamEl = $("conduitBeam" + layerIdx);
  if (!svg || !fxGroup || !pathEl) return;

  const totalLen = pathEl.getTotalLength();
  if (beamEl) {
    beamEl.setAttribute("stroke", col);
    beamEl.classList.add("lit");
    setTimeout(() => beamEl.classList.remove("lit"), 980);
  }

  const spawnPacket = (reverse, delayMs, radius, durMs, pCol) => {
    setTimeout(() => {
      if (!document.body.contains(fxGroup)) return;
      const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
      const halo = document.createElementNS("http://www.w3.org/2000/svg", "circle");
      halo.setAttribute("r", String((radius * 2.2).toFixed(1)));
      halo.setAttribute("fill", pCol);
      halo.setAttribute("opacity", "0.24");
      const dot = document.createElementNS("http://www.w3.org/2000/svg", "circle");
      dot.setAttribute("r", String(radius));
      dot.setAttribute("fill", pCol);
      g.appendChild(halo);
      g.appendChild(dot);
      fxGroup.appendChild(g);

      const t0 = performance.now();
      const tick = (now) => {
        const p = Math.min(1, (now - t0) / durMs);
        const eased = 1 - Math.pow(1 - p, 2.2);
        const dist = reverse ? totalLen * (1 - eased) : totalLen * eased;
        const pt = pathEl.getPointAtLength(dist);
        g.setAttribute("transform", `translate(${pt.x.toFixed(1)},${pt.y.toFixed(1)})`);
        if (p < 1 && document.body.contains(fxGroup)) {
          requestAnimationFrame(tick);
        } else {
          g.remove();
          if (!reverse && delayMs === 0) {
            spawnLandingRipple(fxGroup, pathEl.getPointAtLength(totalLen), pCol);
          }
        }
      };
      requestAnimationFrame(tick);
    }, delayMs);
  };

  // 发射 3 颗纤细光点粒子（AI → 设备运行态）
  spawnPacket(false, 0, 2.5, 440, col);
  spawnPacket(false, 70, 1.9, 440, col);
  spawnPacket(false, 140, 1.4, 440, col);

  // 若属于读取/回传类工具，落地后反向射回数据流粒子（设备 → AI）
  if (withReturn) {
    const retCol = /mem_|read_|dump_/.test(toolName) ? "#f59e0b" : "#0ea5e9";
    spawnPacket(true, 460, 2.2, 420, retCol);
    spawnPacket(true, 535, 1.5, 420, retCol);
  }
}

function spawnLandingRipple(fxGroup, pt, col) {
  if (!document.body.contains(fxGroup)) return;
  [0, 130].forEach((delay) => {
    setTimeout(() => {
      if (!document.body.contains(fxGroup)) return;
      const ring = document.createElementNS("http://www.w3.org/2000/svg", "circle");
      ring.setAttribute("cx", pt.x.toFixed(1));
      ring.setAttribute("cy", pt.y.toFixed(1));
      ring.setAttribute("r", "2.5");
      ring.setAttribute("fill", "none");
      ring.setAttribute("stroke", col);
      ring.setAttribute("stroke-width", "1.2");
      fxGroup.appendChild(ring);
      const t0 = performance.now();
      const dur = 540;
      const step = (now) => {
        const p = Math.min(1, (now - t0) / dur);
        ring.setAttribute("r", (2.5 + p * 14).toFixed(1));
        ring.setAttribute("opacity", (0.9 * (1 - p)).toFixed(2));
        if (p < 1 && document.body.contains(fxGroup)) requestAnimationFrame(step);
        else ring.remove();
      };
      requestAnimationFrame(step);
    }, delay);
  });
}

// 因果贝塞尔光弧：从左栏目标/模块卡右缘射向右侧事件流最新一行左缘
function drawCausalLink(targetEl, rowEl, col) {
  const grid = $("monGrid");
  const layer = $("fxLayer");
  if (!grid || !layer || !targetEl || !rowEl) return;
  const gr = grid.getBoundingClientRect();
  const tr = targetEl.getBoundingClientRect();
  const rr = rowEl.getBoundingClientRect();
  const x1 = tr.right - gr.left;
  const y1 = tr.top + tr.height / 2 - gr.top;
  const x2 = rr.left - gr.left;
  const y2 = rr.top + rr.height / 2 - gr.top;
  if (x2 <= x1) return;
  const mx = (x1 + x2) / 2;
  const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
  path.setAttribute("d", `M ${x1} ${y1} C ${mx} ${y1}, ${mx} ${y2}, ${x2} ${y2}`);
  path.setAttribute("class", "fx-arc");
  path.setAttribute("stroke", col);
  layer.appendChild(path);
  setTimeout(() => path.remove(), 920);

  // 目标卡脉冲 + 右上角扩散光点
  targetEl.classList.remove("hit-ping");
  void targetEl.offsetWidth;
  targetEl.classList.add("hit-ping");
  const dot = document.createElement("span");
  dot.className = "target-dot-fx";
  dot.style.background = col;
  targetEl.appendChild(dot);
  setTimeout(() => dot.remove(), 820);
}

// 统一触发一次 AI 工具调用：写入事件流 + 更新 137 工具计数 + 播放全部对应动效
function emitAiToolOp(spec) {
  const tool = spec.tool;
  const cat = spec.cat || classifyTool(tool);
  const col = /freeze/.test(tool) ? "#38bdf8" : (TOOL_COLOR[cat] || "#4c8dff");
  const layerIdx = toolToLayer(tool, cat);
  const nowStr = new Date().toTimeString().slice(0, 8);
  const id = state.nextEventId++;
  const ev = {
    id,
    tool,
    cat,
    args: spec.args || {},
    ms: spec.ms ?? 0,
    ts: spec.ts || nowStr,
    summary: spec.summary || tool,
    resultPreview: spec.resultPreview || "",
    jumpSo: spec.jumpSo,
    jumpAddr: spec.jumpAddr,
    isPreview: !!spec.isPreview
  };

  if (!state.livePaused) {
    state.liveEvents.unshift(ev);
    if (state.liveEvents.length > 200) state.liveEvents.pop();
    state.selectedEventId = id;
  }
  state.toolCounts[tool] = (state.toolCounts[tool] || 0) + 1;
  state.busyTool = tool;
  state.lastOps = { tool, cat, layer: layerIdx, summary: ev.summary, ms: ev.ms, col };

  // 行为监控：Hook 墙 8 枚芯片依次点亮
  const triggerHookCascade = /behavior_monitor/.test(tool);
  if (triggerHookCascade) {
    HOOK_NAMES.forEach((h) => state.activeHooks.add(h));
  }
  // 冻结进程：设备运行态面板进入短暂冰霜冻结态
  const isFreeze = /freeze_process/.test(tool);
  if (isFreeze) {
    state.deviceFrozen = true;
    clearTimeout(freezeTimer);
    freezeTimer = setTimeout(() => {
      state.deviceFrozen = false;
      $("devConsole")?.classList.remove("frozen");
    }, 1450);
  }
  // 设置断点：联动加入断点标记
  if (/set_breakpoint/.test(tool) && ev.jumpSo && ev.jumpAddr) {
    state.breakpoints.add(fnKey(ev.jumpSo, ev.jumpAddr));
  }

  // 若开着视角跟随且带真实 SO 函数地址，非工具流模式下自动跳到该函数并触发代码扫光
  const shouldJump = state.followAi && ev.jumpSo && ev.jumpAddr !== undefined && state.mode !== "live" && state.mode !== "tools";
  if (shouldJump) {
    jumpTo(ev.jumpSo, ev.jumpAddr, true);
  } else {
    renderTopbar();
    if (state.mode === "live") renderLiveView(true);
    else if (state.mode === "tools") renderToolsView(true);
  }

  // 触发全局光束 / 迷你雷达 / 热力条扫光
  triggerBeamAndHud(ev, col, layerIdx);

  // 代码行扫光高亮
  if (ev.jumpAddr !== undefined && (state.mode === "split" || state.mode === "disasm")) {
    const row = document.querySelector(`.insn-row[data-iaddr="${ev.jumpAddr}"]`) || document.querySelector(".insn-row");
    const pc = document.querySelector(`.pc-line[data-paddr="${ev.jumpAddr}"]`);
    [row, pc].forEach((el) => {
      if (!el) return;
      el.classList.remove("ai-hit");
      void el.offsetWidth;
      el.classList.add("ai-hit");
    });
  }

  // 工具流舞台内实时特效（SVG 光粒子 + 设备层高亮 + 因果光弧 + Hook 墙级联点亮）
  if (state.mode === "live") {
    const core = $("aiCoreCard");
    if (core) {
      core.style.setProperty("--ops-col", col);
      core.classList.add("firing");
      clearTimeout(opsFiringTimer);
      opsFiringTimer = setTimeout(() => core.classList.remove("firing"), 1150);
    }
    animateConduitPulse(layerIdx, col, isReadbackTool(tool), tool);

    // 驱动右侧真实设备运行态监控面板（铭牌脉冲 / 对应子系统卡扫光 / 冻结霜纹 / 断点震动锁定 / 内存激光 / Hook LED 级联点亮）
    const devCon = $("devConsole");
    if (devCon) {
      devCon.style.setProperty("--dev-col", col);
      devCon.classList.add("active-pulse");
      setTimeout(() => devCon.classList.remove("active-pulse"), 1150);
      if (isFreeze) {
        devCon.classList.remove("frozen");
        void devCon.offsetWidth;
        devCon.classList.add("frozen");
      }
      if (cat === "bp" || isFreeze) {
        devCon.classList.remove("hit-shake");
        void devCon.offsetWidth;
        devCon.classList.add("hit-shake");
        setTimeout(() => devCon.classList.remove("hit-shake"), 360);
      }
    }
    const dcLed = $("dcMainLed");
    if (dcLed) {
      dcLed.classList.remove("blink");
      void dcLed.offsetWidth;
      dcLed.classList.add("blink");
    }
    const subCard = $("subCard" + layerIdx);
    if (subCard) {
      subCard.style.setProperty("--sub-col", col);
      subCard.classList.remove("ping", "strobe");
      void subCard.offsetWidth;
      subCard.classList.add("ping");
      if (cat === "vm") subCard.classList.add("strobe");
      setTimeout(() => subCard.classList.remove("ping", "strobe"), 1100);
    }
    if (layerIdx === 2) {
      const laser = $("memLaser");
      if (laser) {
        laser.classList.remove("go");
        void laser.offsetWidth;
        laser.classList.add("go");
      }
    }
    if (triggerHookCascade) {
      document.querySelectorAll(".m-led").forEach((el, idx) => {
        setTimeout(() => {
          el.classList.add("on", "ign");
          setTimeout(() => el.classList.remove("ign"), 600);
        }, idx * 65);
      });
    }
    if (triggerHookCascade) {
      document.querySelectorAll(".hk-chip").forEach((chip, idx) => {
        setTimeout(() => {
          chip.classList.add("on", "poweron");
          setTimeout(() => chip.classList.remove("poweron"), 650);
        }, idx * 75);
      });
    }
    // 因果光弧连线（模块或设备槽 → 新事件行）
    requestAnimationFrame(() => {
      const soTarget = ev.jumpSo ? document.querySelector(`.target-card[data-tso="${ev.jumpSo}"]`) : null;
      const tgt = soTarget || document.querySelector('.target-card[data-tdev="android"]');
      const freshRow = document.querySelector(".ev-card.fresh");
      if (tgt && freshRow) drawCausalLink(tgt, freshRow, col);
    });
  }
}

let replayTimer = null;
function toggleReplayAi() {
  if (state.replayingAi) {
    clearInterval(replayTimer);
    state.replayingAi = false;
    renderTopbar();
    if (state.mode === "live") renderLiveView();
    return;
  }
  state.replayingAi = true;
  state.followAi = true;
  // 串联设备动效预览 + 真实样本分析事件，完整展示全链路 AI 操控特效
  const seq = [
    FX_SCENARIOS.probe,
    FX_SCENARIOS.ui,
    FX_SCENARIOS.hook,
    FX_SCENARIOS.freeze,
    FX_SCENARIOS.bp,
    FX_SCENARIOS.mem,
    ...(MDA_DATA.recordedEvents || []).slice(4, 7).map((e) => ({
      ...e, cat: e.kind === "plugin" ? "plugin" : classifyTool(e.tool), isPreview: false
    })),
    FX_SCENARIOS.vm
  ];
  let idx = 0;
  const step = () => {
    const cur = seq[idx];
    emitAiToolOp(cur);
    idx++;
    if (idx >= seq.length) {
      clearInterval(replayTimer);
      state.replayingAi = false;
      renderTopbar();
      if (state.mode === "live") renderLiveView();
    }
  };
  step();
  replayTimer = setInterval(step, 1450);
}

/* ════════ 舞台主分发 ════════ */
function renderStage() {
  if (panZoomAbort && state.mode !== "cfg" && state.mode !== "graph") {
    panZoomAbort.abort();
    panZoomAbort = null;
  }
  $("modeTabs").querySelectorAll(".mode-tab").forEach((b) => {
    b.classList.toggle("on", b.dataset.mode === state.mode);
  });
  const fn = getFn();
  if (state.mode === "disasm") {
    $("stageBody").innerHTML = `<div class="split-view">${buildDisasmPane(fn)}</div>`;
    bindCodeInteractions();
  } else if (state.mode === "split") {
    $("stageBody").innerHTML = `<div class="split-view is-split">${buildDisasmPane(fn)}${buildPseudoPane(fn)}</div>`;
    bindCodeInteractions();
  } else if (state.mode === "cfg") {
    renderCfgView(fn);
  } else if (state.mode === "graph") {
    renderGraphView(fn);
  } else if (state.mode === "tools") {
    renderToolsView();
  } else {
    renderLiveView();
  }
}

        <span>${hex(fn.addr)}</span>
        <span>·</span>
        <span>${fn.size} B</span>
        <span>·</span>
        <span>${esc(fn.section || ".text")}</span>
      </div>
    </div>

    <div class="insp-sec">
      <div class="insp-sec-title">概况</div>
      <div class="kv-grid">
        <div class="kv-box"><div class="k">调用者</div><div class="v">${callers.length}</div></div>
        <div class="kv-box"><div class="k">被调用</div><div class="v">${callees.length}</div></div>
        <div class="kv-box"><div class="k">CFG 基本块</div><div class="v">${det ? det.cfg.length : "—"}</div></div>
        <div class="kv-box"><div class="k">断点状态</div><div class="v" style="color:${hasBp ? "var(--rose)" : "var(--fg-3)"}">${hasBp ? "已标记" : "未设置"}</div></div>
      </div>
    </div>

    <div class="insp-sec">
      <div class="insp-sec-title">调用者 <span class="cnt">${callers.length}</span></div>
      ${callers.length ? callers.map((c) => `
        <div class="xref-row" data-xso="${esc(c.so)}" data-xaddr="${c.addr}">
          <span class="nm" title="${esc(c.name)}">${esc(c.name)}</span>
          ${c.so !== state.so ? `<span class="pill-badge cross">${esc(c.so)}</span>` : ""}
          <span class="ad">${hex(c.addr)}</span>
        </div>`).join("") : '<div style="font-size:11.5px;color:var(--fg-3)">当前加载模块中无直接调用者</div>'}
    </div>

    <div class="insp-sec">
      <div class="insp-sec-title">被调用 <span class="cnt">${callees.length}</span></div>
      ${callees.length ? callees.map((c) => `
        <div class="xref-row" data-xso="${esc(c.so)}" data-xaddr="${c.addr}" data-plt="${c.plt ? "1" : ""}">
          <span class="nm" title="${esc(c.name)}">${esc(c.name)}</span>
          ${c.so !== state.so ? `<span class="pill-badge cross">${esc(c.so)}</span>` : (c.plt ? '<span class="pill-badge plt">PLT</span>' : "")}
          <span class="ad">${c.plt && c.so === state.so ? "ext" : hex(c.addr)}</span>
        </div>`).join("") : '<div style="font-size:11.5px;color:var(--fg-3)">叶子函数（无直接调用）</div>'}
    </div>

    <div class="insp-sec">
      <div class="insp-sec-title">引用字符串 <span class="cnt">${strs.length}</span></div>
      ${strs.length ? strs.map((s) => `<div class="str-chip" data-saddr="${s.insnAddr ?? ""}" title="${esc(s.value)}">"${esc(s.value)}"</div>`).join("")
        : '<div style="font-size:11.5px;color:var(--fg-3)">无引用字符串</div>'}
    </div>`;

  $("rightInspector").querySelectorAll(".xref-row").forEach((r) => {
    r.onclick = () => {
      if (r.dataset.plt === "1" && r.dataset.xso === state.so) {
        showToast("外部 libc 导入符号（未加载 libc.so）");
        return;
      }
      jumpTo(r.dataset.xso, Number(r.dataset.xaddr));
    };
  });
  $("rightInspector").querySelectorAll(".str-chip[data-saddr]").forEach((c) => {
    c.onclick = () => {
      const a = Number(c.dataset.saddr);
      if (!a) return;
      state.selInsnAddr = a;
      syncHighlight(a, true);
      document.querySelector(`.insn-row[data-iaddr="${a}"]`)?.scrollIntoView({ block: "center", behavior: "smooth" });
    };
  });
}

/* ════════ 原地重命名 / 注释 / 断点 ════════ */
function toggleBpAt(addr = state.addr) {
  const k = fnKey(state.so, addr);
  if (state.breakpoints.has(k)) {
    state.breakpoints.delete(k);
    showToast(`已取消断点标记 ${hex(addr)}`);
  } else {
    state.breakpoints.add(k);
    showToast(`已标记断点 ${state.so} @ ${hex(addr)}`);
  }
  renderAll();
}

function openInlineDialog(kind) {
  const modal = $("inlineModal");
  const inp = $("inlineInput");
  const fn = getFn();
  if (kind === "rename") {
    $("inlineTitle").textContent = `重命名函数 · ${hex(fn.addr)}`;
    inp.value = displayName(state.so, fn);
  } else {
    const a = state.selInsnAddr || fn.addr;
    $("inlineTitle").textContent = `添加/编辑指令注释 · ${hex(a)}`;
    inp.value = state.comments[fnKey(state.so, a)] || "";
  }
  modal.dataset.kind = kind;
  modal.classList.add("open");
  setTimeout(() => { inp.focus(); inp.select(); }, 20);
}

function submitInlineDialog() {
  const modal = $("inlineModal");
  const kind = modal.dataset.kind;
  const val = $("inlineInput").value.trim();
  const fn = getFn();
  if (kind === "rename" && val) {
    state.renames[fnKey(state.so, fn.addr)] = val;
    showToast(`已重命名为 ${val}`);
  } else if (kind === "comment") {
    const a = state.selInsnAddr || fn.addr;
    if (val) state.comments[fnKey(state.so, a)] = val;
    else delete state.comments[fnKey(state.so, a)];
    showToast(val ? `已添加注释 @ ${hex(a)}` : `已清除注释 @ ${hex(a)}`);
  }
  modal.classList.remove("open");
  renderAll();
}

/* ════════ ⌘K 全局命令面板 ════════ */
function buildPaletteItems(q) {
  const kw = q.trim().toLowerCase();
  const actions = [
    { kind: "视图", title: "AI 实时工具流 & 设备操控动效舞台", meta: "5", run: () => { state.mode = "live"; renderAll(); } },
    { kind: "视图", title: "全部 137 个真实 MCP 工具目录", meta: "6", run: () => { state.mode = "tools"; renderAll(); } },
    { kind: "动效", title: "⚡ 全链路演示 AI 操控 Android 设备特效", meta: "Demo", run: toggleReplayAi },
    { kind: "视图", title: "并排对照：反汇编 + 伪代码 (F5)", meta: "F5", run: () => { state.mode = "split"; renderAll(); } },
    { kind: "视图", title: "CFG 基本块控制流图 (Space)", meta: "Space", run: () => { state.mode = "cfg"; renderAll(); } },
    { kind: "视图", title: "跨 SO 调用图谱 (libbase ↔ liblog)", meta: "4", run: () => { state.mode = "graph"; renderAll(); } },
    { kind: "操作", title: "切换深色 / 浅色主题", meta: "Theme", run: toggleTheme },
    { kind: "操作", title: "打开/收起底部 Frida 终端抽屉", meta: "⌘J", run: () => { state.drawerTab = "terminal"; toggleDrawer(true); } },
    { kind: "操作", title: "原地重命名当前函数", meta: "N", run: () => openInlineDialog("rename") }
  ];
  const toolItems = (MDA_DATA.toolsCatalog || []).map((t) => ({
    kind: "工具",
    title: `${t.name} — ${t.desc}`,
    meta: TOOL_LABEL[classifyTool(t.name)] || "工具",
    run: () => { state.selectedTool = t.name; state.mode = "tools"; renderAll(); }
  }));
  const fnItems = [];
  for (const [soName, mod] of Object.entries(MDA_DATA.modules)) {
    for (const f of mod.funcs) {
      fnItems.push({
        kind: "函数",
        title: displayName(soName, f),
        meta: `${soName} · ${hex(f.addr)}`,
        run: () => jumpTo(soName, f.addr)
      });
    }
  }
  const strItems = getMod().strings.slice(0, 60).map((s) => ({
    kind: "串",
    title: `"${s.value}"`,
    meta: `${state.so} · ${hex(s.addr)}`,
    run: () => { if (s.refFn) jumpTo(state.so, s.refFn); }
  }));

  const all = [...actions, ...toolItems, ...fnItems, ...strItems];
  return (kw ? all.filter((x) => x.title.toLowerCase().includes(kw) || x.meta.toLowerCase().includes(kw)) : all).slice(0, 28);
}

function renderPalette() {
  const q = $("paletteInput").value;
  state.paletteItems = buildPaletteItems(q);
  if (state.paletteIdx >= state.paletteItems.length) state.paletteIdx = 0;
  $("paletteList").innerHTML = state.paletteItems.map((it, i) => `
    <div class="pal-row${i === state.paletteIdx ? " active" : ""}" data-pi="${i}">
      <span class="pal-kind">${it.kind}</span>
      <span class="pal-title">${esc(it.title)}</span>
      <span class="pal-meta">${esc(it.meta)}</span>
    </div>`).join("") || `<div style="padding:20px;text-align:center;color:var(--fg-3)">没有匹配项</div>`;
  $("paletteList").querySelectorAll(".pal-row").forEach((r) => {
    r.onclick = () => execPalette(Number(r.dataset.pi));
  });
}

function openPalette() {
  state.paletteOpen = true;
  state.paletteIdx = 0;
  $("paletteBackdrop").classList.add("open");
  $("paletteInput").value = "";
  renderPalette();
  setTimeout(() => $("paletteInput").focus(), 10);
}
function closePalette() {
  state.paletteOpen = false;
  $("paletteBackdrop").classList.remove("open");
}
function execPalette(idx) {
  const it = state.paletteItems[idx];
  closePalette();
  if (it) it.run();
}

/* ════════ 面板折叠、主题与拖拽缩放 ════════ */
function toggleTheme() {
  const root = document.documentElement;
  const next = root.dataset.theme === "dark" ? "light" : "dark";
  root.dataset.theme = next;
  $("themeText").textContent = next === "dark" ? "深色" : "浅色";
}
function togglePanel(el, btn, forceOpen) {
  const open = forceOpen !== undefined ? forceOpen : el.classList.contains("collapsed");
  el.classList.toggle("collapsed", !open);
  btn.classList.toggle("on", open);
}
function toggleDrawer(forceOpen) {
  togglePanel($("bottomDrawer"), $("btnToggleDrawer"), forceOpen);
  renderDrawer();
}

function setupResizer(handleId, targetId, axis, cssVar, minV, maxV, invert) {
  const h = $(handleId), t = $(targetId);
  let active = false, startPos = 0, startSize = 0;
  h.onmousedown = (e) => {
    e.preventDefault();
    active = true;
    h.classList.add("active");
    t.classList.add("resizing");
    startPos = axis === "x" ? e.clientX : e.clientY;
    startSize = axis === "x" ? t.getBoundingClientRect().width : t.getBoundingClientRect().height;
  };
  window.addEventListener("mousemove", (e) => {
    if (!active) return;
    const delta = (axis === "x" ? e.clientX : e.clientY) - startPos;
    const next = Math.max(minV, Math.min(maxV, startSize + (invert ? -delta : delta)));
    t.style.setProperty(cssVar, next + "px");
  });
  window.addEventListener("mouseup", () => {
    if (!active) return;
    active = false;
    h.classList.remove("active");
    t.classList.remove("resizing");
  });
}

function renderAll() {
  renderTopbar();
  renderHeatmap();
  renderLeft();
  renderStage();
  renderDrawer();
  renderInspector();
}

/* ════════ 事件绑定与全局快捷键 ════════ */
$("btnBack").onclick = goBack;
$("btnFwd").onclick = goFwd;
$("btnCmd").onclick = openPalette;
$("btnTheme").onclick = toggleTheme;
$("btnToggleLeft").onclick = () => togglePanel($("leftSidebar"), $("btnToggleLeft"));
$("btnToggleRight").onclick = () => togglePanel($("rightInspector"), $("btnToggleRight"));
$("btnToggleDrawer").onclick = () => toggleDrawer();
$("btnCloseDrawer").onclick = () => toggleDrawer(false);
$("btnRename").onclick = () => openInlineDialog("rename");
$("btnComment").onclick = () => openInlineDialog("comment");
$("btnBp").onclick = () => toggleBpAt();
$("btnDemoOps").onclick = toggleReplayAi;
$("deviceHud").onclick = () => { state.mode = "live"; renderAll(); };
$("btnAiPill").onclick = () => {
  if (state.mode !== "live") {
    state.mode = "live";
    renderAll();
  } else {
    state.followAi = !state.followAi;
    renderTopbar();
    showToast(state.followAi ? "已开启 AI 视角跟随" : "已暂停 AI 视角跟随");
  }
};

$("leftSeg").querySelectorAll("button").forEach((b) => {
  b.onclick = () => { state.leftTab = b.dataset.tab; renderLeft(); };
});
$("leftFilter").oninput = (e) => { state.leftFilter = e.target.value; renderLeft(); };
$("modeTabs").querySelectorAll(".mode-tab").forEach((b) => {
  b.onclick = () => { state.mode = b.dataset.mode; renderAll(); };
});
$("bottomDrawer").querySelectorAll(".drawer-hd .dtab").forEach((b) => {
  b.onclick = () => { state.drawerTab = b.dataset.dtab; renderDrawer(); };
});

$("paletteBackdrop").onclick = (e) => { if (e.target === $("paletteBackdrop")) closePalette(); };
$("paletteInput").oninput = () => { state.paletteIdx = 0; renderPalette(); };
$("paletteInput").onkeydown = (e) => {
  if (e.key === "ArrowDown") { e.preventDefault(); state.paletteIdx = Math.min(state.paletteItems.length - 1, state.paletteIdx + 1); renderPalette(); }
  else if (e.key === "ArrowUp") { e.preventDefault(); state.paletteIdx = Math.max(0, state.paletteIdx - 1); renderPalette(); }
  else if (e.key === "Enter") { e.preventDefault(); execPalette(state.paletteIdx); }
  else if (e.key === "Escape") { e.preventDefault(); closePalette(); }
};

$("inlineCancel").onclick = () => $("inlineModal").classList.remove("open");
$("inlineConfirm").onclick = submitInlineDialog;
$("inlineInput").onkeydown = (e) => {
  if (e.key === "Enter") { e.preventDefault(); submitInlineDialog(); }
  if (e.key === "Escape") { e.preventDefault(); $("inlineModal").classList.remove("open"); }
};

window.addEventListener("keydown", (e) => {
  const mod = e.metaKey || e.ctrlKey;
  if (mod && e.key.toLowerCase() === "k") { e.preventDefault(); state.paletteOpen ? closePalette() : openPalette(); return; }
  if (mod && e.key.toLowerCase() === "b") { e.preventDefault(); togglePanel($("leftSidebar"), $("btnToggleLeft")); return; }
  if (mod && e.key.toLowerCase() === "j") { e.preventDefault(); toggleDrawer(); return; }
  if (mod && e.key.toLowerCase() === "i") { e.preventDefault(); togglePanel($("rightInspector"), $("btnToggleRight")); return; }
  if (e.altKey && e.key === "ArrowLeft") { e.preventDefault(); goBack(); return; }
  if (e.altKey && e.key === "ArrowRight") { e.preventDefault(); goFwd(); return; }

  // 绝不拦截输入框 / textarea 内的普通按键
  const tag = (e.target && e.target.tagName) || "";
  if (tag === "INPUT" || tag === "TEXTAREA" || state.paletteOpen || $("inlineModal").classList.contains("open")) return;

  if (e.key === "F5") { e.preventDefault(); state.mode = state.mode === "split" ? "disasm" : "split"; renderAll(); }
  else if (e.key === " ") { e.preventDefault(); state.mode = state.mode === "cfg" ? "split" : "cfg"; renderAll(); }
  else if (e.key === "1") { state.mode = "disasm"; renderAll(); }
  else if (e.key === "4") { state.mode = "graph"; renderAll(); }
  else if (e.key === "5") { state.mode = "live"; renderAll(); }
  else if (e.key === "6") { state.mode = "tools"; renderAll(); }
  else if (e.key.toLowerCase() === "n") { e.preventDefault(); openInlineDialog("rename"); }
  else if (e.key === ";") { e.preventDefault(); openInlineDialog("comment"); }
  else if (e.key.toLowerCase() === "b") { e.preventDefault(); toggleBpAt(); }
});

setupResizer("resizerLeft", "leftSidebar", "x", "--left-w", 170, 420, false);
setupResizer("resizerRight", "rightInspector", "x", "--right-w", 220, 460, true);
setupResizer("resizerDrawer", "bottomDrawer", "y", "--drawer-h", 120, 420, true);

initLiveStream();
renderAll();
</script>
</body>
</html>
