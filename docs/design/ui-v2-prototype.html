<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MDA Studio · 下一代前端交互原型（真实样本驱动）</title>
<style>
/* ═══════════════════════════════════════════════════════════════
   MDA Studio v2 Prototype — Operate Mode Design System
   设计原则：
   1. UI 用无衬线系统字体，仅代码/地址/字节/终端用等宽字（拒绝全站等宽硬框）
   2. 3 级细腻表面明度层次 + 柔和圆角 + 160ms 指数缓出微交互
   3. 可拖拽分屏、底部抽屉、双向 F5 联动、可缩放 CFG 与跨 SO 图谱、⌘K 命令面板
   4. 全部嵌入数据来自 samples/liblog.so 与 samples/libbase.so 真实解析结果
   ═══════════════════════════════════════════════════════════════ */
:root {
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Hiragino Sans GB", "Segoe UI", system-ui, sans-serif;
  --mono: "SF Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;

  /* 暗色默认：石墨蓝黑（专业逆向工作台低疲劳配色） */
  --bg: #0c0f14;
  --surface: #12161f;
  --surface-2: #171c28;
  --surface-3: #1f2636;
  --surface-hover: #222a3c;
  --line: #232b3b;
  --line-strong: #344058;
  --fg: #e7edf7;
  --fg-2: #9aa7bd;
  --fg-3: #68768f;
  --accent: #4c8dff;
  --accent-fg: #ffffff;
  --accent-soft: rgba(76, 141, 255, 0.14);
  --accent-ring: rgba(76, 141, 255, 0.36);

  /* 语义色（代码高亮 / 分支 / 跨模块 / 状态） */
  --c-call: #60a5fa;
  --c-branch: #c084fc;
  --c-ret: #fbbf24;
  --c-mem: #2dd4bf;
  --c-reg: #cbd5e1;
  --c-imm: #f59e0b;
  --c-str: #34d399;
  --c-cmt: #64748b;
  --c-kw: #c084fc;
  --c-type: #38bdf8;
  --green: #34d399;
  --green-soft: rgba(52, 211, 153, 0.13);
  --amber: #fbbf24;
  --amber-soft: rgba(251, 191, 36, 0.14);
  --rose: #fb7185;
  --rose-soft: rgba(251, 113, 133, 0.14);
  --violet: #a78bfa;
  --violet-soft: rgba(167, 139, 250, 0.14);

  --hot-0: rgba(148, 163, 184, 0.08);
  --hot-1: rgba(76, 141, 255, 0.28);
  --hot-2: rgba(76, 141, 255, 0.56);
  --hot-3: rgba(96, 165, 250, 0.88);
  --hot-4: #93c5fd;

  --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.28);
  --shadow-lg: 0 20px 56px rgba(0, 0, 0, 0.58), 0 0 0 1px var(--line-strong);
  --radius-sm: 5px;
  --radius-md: 8px;
  --radius-lg: 12px;
}

[data-theme="light"] {
  --bg: #f1f4f8;
  --surface: #ffffff;
  --surface-2: #f7f9fc;
  --surface-3: #edf1f7;
  --surface-hover: #e8eef7;
  --line: #e2e8f0;
  --line-strong: #cbd5e1;
  --fg: #0f172a;
  --fg-2: #475569;
  --fg-3: #64748b;
  --accent: #2563eb;
  --accent-fg: #ffffff;
  --accent-soft: rgba(37, 99, 235, 0.09);
  --accent-ring: rgba(37, 99, 235, 0.28);

  --c-call: #1d4ed8;
  --c-branch: #7e22ce;
  --c-ret: #b45309;
  --c-mem: #0f766e;
  --c-reg: #334155;
  --c-imm: #b45309;
  --c-str: #047857;
  --c-cmt: #64748b;
  --c-kw: #7c3aed;
  --c-type: #0369a1;
  --green: #059669;
  --green-soft: rgba(5, 150, 105, 0.11);
  --amber: #b45309;
  --amber-soft: rgba(180, 83, 9, 0.11);
  --rose: #e11d48;
  --rose-soft: rgba(225, 29, 72, 0.10);
  --violet: #7c3aed;
  --violet-soft: rgba(124, 58, 237, 0.10);

  --hot-0: rgba(15, 23, 42, 0.05);
  --hot-1: #dbeafe;
  --hot-2: #93c5fd;
  --hot-3: #3b82f6;
  --hot-4: #1d4ed8;

  --shadow-sm: 0 2px 8px rgba(15, 23, 42, 0.08);
  --shadow-lg: 0 24px 60px rgba(15, 23, 42, 0.18), 0 0 0 1px var(--line-strong);
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; margin: 0; overflow: hidden; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--sans);
  font-size: 13px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  user-select: none;
}

/* 浏览器原生表面主题化 */
::selection { background: var(--accent-soft); color: var(--fg); }
:focus-visible { outline: 2px solid var(--accent-ring); outline-offset: 1px; }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb {
  background: color-mix(in srgb, var(--fg-3) 32%, transparent);
  border-radius: 99px;
  border: 2px solid transparent;
  background-clip: content-box;
}
::-webkit-scrollbar-thumb:hover { background: color-mix(in srgb, var(--fg-3) 55%, transparent); background-clip: content-box; }

.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.ic {
  width: 14px; height: 14px; flex: 0 0 14px;
  stroke: currentColor; fill: none; stroke-width: 1.6;
  stroke-linecap: round; stroke-linejoin: round;
}
.ic-sm { width: 12px; height: 12px; flex: 0 0 12px; }

/* ════════ 顶栏 ════════ */
.shell { height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

.topbar {
  height: 44px; flex: 0 0 44px;
  display: flex; align-items: center; gap: 10px;
  padding: 0 12px;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
}
.brand {
  display: flex; align-items: center; gap: 8px;
  font-weight: 650; font-size: 13.5px; letter-spacing: -0.01em;
  color: var(--fg); padding-right: 4px;
}
.brand-mark {
  width: 22px; height: 22px; border-radius: 6px;
  background: var(--accent); color: #fff;
  display: grid; place-items: center;
  font-family: var(--mono); font-size: 11px; font-weight: 700;
  box-shadow: 0 2px 8px color-mix(in srgb, var(--accent) 40%, transparent);
}
.brand-ver {
  font-family: var(--mono); font-size: 10.5px; font-weight: 500;
  color: var(--fg-3); background: var(--surface-3);
  padding: 1px 6px; border-radius: 99px;
}
.sep { width: 1px; height: 18px; background: var(--line); flex: 0 0 1px; }

/* 模块胶囊 */
.mod-pills { display: flex; align-items: center; gap: 4px; }
.mod-pill {
  height: 28px; padding: 0 10px; border-radius: var(--radius-sm);
  border: 1px solid transparent; background: transparent;
  color: var(--fg-2); font-family: var(--mono); font-size: 12px;
  display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
  transition: background 140ms var(--ease-out), color 140ms var(--ease-out), border-color 140ms var(--ease-out);
}
.mod-pill:hover { background: var(--surface-3); color: var(--fg); }
.mod-pill.active {
  background: var(--accent-soft); color: var(--fg);
  border-color: color-mix(in srgb, var(--accent) 38%, transparent);
}
.mod-dot { width: 7px; height: 7px; border-radius: 50%; flex: 0 0 7px; }
.mod-pill .cnt { font-size: 10.5px; color: var(--fg-3); }

/* 历史前进后退 */
.nav-hist { display: flex; align-items: center; gap: 2px; }
.icon-btn {
  width: 28px; height: 28px; border-radius: var(--radius-sm);
  border: 1px solid transparent; background: transparent;
  color: var(--fg-2); display: inline-grid; place-items: center;
  cursor: pointer; transition: background 140ms var(--ease-out), color 140ms var(--ease-out);
}
.icon-btn:hover:not(:disabled) { background: var(--surface-3); color: var(--fg); }
.icon-btn:disabled { opacity: 0.34; cursor: default; }
.icon-btn.on { background: var(--accent-soft); color: var(--accent); }

/* ⌘K 命令搜索框 */
.cmd-trigger {
  flex: 1; max-width: 420px; min-width: 180px; height: 30px;
  margin: 0 auto; padding: 0 10px;
  border-radius: 7px; border: 1px solid var(--line);
  background: var(--surface-2); color: var(--fg-2);
  display: flex; align-items: center; gap: 8px;
  cursor: pointer; font-size: 12.5px;
  transition: border-color 150ms var(--ease-out), background 150ms var(--ease-out);
}
.cmd-trigger:hover { border-color: var(--line-strong); background: var(--surface-3); color: var(--fg); }
.cmd-crumb {
  flex: 1; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  font-family: var(--mono); font-size: 12px; color: var(--fg);
}
.cmd-crumb span { color: var(--fg-3); }
.kbd {
  font-family: var(--mono); font-size: 10.5px; color: var(--fg-3);
  background: var(--surface); border: 1px solid var(--line);
  padding: 1px 5px; border-radius: 4px; flex: 0 0 auto;
}

/* AI 副驾状态胶囊 */
.ai-pill {
  height: 28px; padding: 0 10px; border-radius: 99px;
  border: 1px solid var(--line); background: var(--surface-2);
  color: var(--fg-2); font-size: 12px;
  display: inline-flex; align-items: center; gap: 7px;
  cursor: pointer; transition: all 150ms var(--ease-out);
}
.ai-pill:hover { border-color: var(--line-strong); color: var(--fg); }
.ai-pill.following {
  border-color: color-mix(in srgb, var(--green) 45%, transparent);
  background: var(--green-soft); color: var(--fg);
}
.pulse-dot {
  width: 7px; height: 7px; border-radius: 50%; background: var(--green);
  box-shadow: 0 0 0 0 color-mix(in srgb, var(--green) 55%, transparent);
}
.ai-pill.busy .pulse-dot { animation: ping 1.2s var(--ease-out) infinite; }
@keyframes ping {
  0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--green) 55%, transparent); }
  100% { box-shadow: 0 0 0 6px transparent; }
}

.top-btn {
  height: 28px; padding: 0 10px; border-radius: var(--radius-sm);
  border: 1px solid var(--line); background: var(--surface-2);
  color: var(--fg-2); font-size: 12px; font-weight: 500;
  display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
  transition: all 140ms var(--ease-out);
}
.top-btn:hover { background: var(--surface-3); color: var(--fg); border-color: var(--line-strong); }

/* ════════ 全局引用热力带 ════════ */
.heatstrip {
  height: 22px; flex: 0 0 22px;
  display: flex; align-items: center; gap: 10px;
  padding: 0 12px;
  background: var(--surface-2);
  border-bottom: 1px solid var(--line);
  position: relative;
}
.heat-label {
  font-size: 11px; color: var(--fg-3); white-space: nowrap;
  display: inline-flex; align-items: center; gap: 5px;
}
.heat-bars {
  flex: 1; height: 12px; display: flex; align-items: stretch; gap: 1px;
  cursor: crosshair; position: relative;
}
.heat-bar {
  flex: 1; border-radius: 1.5px; transition: transform 100ms var(--ease-out), opacity 100ms;
}
.heat-bar:hover { transform: scaleY(1.35); opacity: 1 !important; }
.heat-cursor {
  position: absolute; top: -2px; bottom: -2px; width: 2px;
  background: var(--amber); border-radius: 2px; pointer-events: none;
  transition: left 220ms var(--ease-out);
}
.heat-tip {
  position: fixed; z-index: 80; pointer-events: none;
  padding: 5px 8px; border-radius: 6px;
  background: var(--surface-3); color: var(--fg);
  border: 1px solid var(--line-strong); box-shadow: var(--shadow-sm);
  font-family: var(--mono); font-size: 11px; white-space: nowrap;
  opacity: 0; transition: opacity 100ms;
}
.heat-tip.show { opacity: 1; }

/* ════════ 主工作区（可拖拽三栏 + 可拖拽底部抽屉） ════════ */
.main-area { flex: 1; min-height: 0; display: flex; overflow: hidden; }

.sidebar {
  width: var(--left-w, 252px); flex: 0 0 auto; min-width: 0;
  display: flex; flex-direction: column;
  background: var(--surface); border-right: 1px solid var(--line);
  overflow: hidden;
  transition: width 180ms var(--ease-out);
}
.sidebar.collapsed { width: 0 !important; border-right: none; }
.sidebar.resizing, .inspector.resizing, .drawer.resizing { transition: none !important; }

.resizer-v {
  width: 5px; flex: 0 0 5px; margin: 0 -2px; z-index: 10;
  cursor: col-resize; position: relative;
}
.resizer-v::after {
  content: ""; position: absolute; inset: 0 2px;
  background: transparent; transition: background 140ms;
}
.resizer-v:hover::after, .resizer-v.active::after { background: var(--accent); }

.resizer-h {
  height: 5px; flex: 0 0 5px; margin: -2px 0; z-index: 10;
  cursor: row-resize; position: relative;
}
.resizer-h::after {
  content: ""; position: absolute; inset: 2px 0;
  background: transparent; transition: background 140ms;
}
.resizer-h:hover::after, .resizer-h.active::after { background: var(--accent); }

/* 左侧分段控件 & 列表 */
.seg-wrap { padding: 8px 8px 6px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px; }
.seg {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px;
  padding: 2px; border-radius: 7px; background: var(--surface-2);
  border: 1px solid var(--line);
}
.seg button {
  height: 24px; border: none; border-radius: 5px; background: transparent;
  color: var(--fg-2); font-size: 11.5px; font-weight: 500; cursor: pointer;
  transition: all 140ms var(--ease-out);
}
.seg button:hover { color: var(--fg); }
.seg button.on { background: var(--surface-3); color: var(--fg); box-shadow: 0 1px 2px rgba(0,0,0,0.16); }

.filter-box {
  height: 28px; display: flex; align-items: center; gap: 6px; padding: 0 8px;
  border-radius: 6px; border: 1px solid var(--line); background: var(--surface-2);
}
.filter-box:focus-within { border-color: var(--accent); }
.filter-box input {
  flex: 1; min-width: 0; border: none; background: transparent;
  color: var(--fg); font-size: 12px; outline: none; font-family: var(--sans);
}
.filter-box input::placeholder { color: var(--fg-3); }

.list-body { flex: 1; overflow-y: auto; padding: 4px 6px; }
.fn-item {
  display: flex; align-items: center; gap: 6px;
  padding: 5px 8px; border-radius: var(--radius-sm);
  cursor: pointer; margin-bottom: 1px;
  transition: background 120ms var(--ease-out);
}
.fn-item:hover { background: var(--surface-hover); }
.fn-item.sel { background: var(--accent-soft); }
.fn-item .fn-nm {
  flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  font-family: var(--mono); font-size: 11.5px; color: var(--fg-2);
}
.fn-item.exp .fn-nm { color: var(--fg); font-weight: 500; }
.fn-item.sel .fn-nm { color: var(--accent); font-weight: 600; }
.fn-item .fn-addr { font-family: var(--mono); font-size: 10.5px; color: var(--fg-3); }
.fn-item .fn-ref {
  font-family: var(--mono); font-size: 10px; min-width: 18px; text-align: right;
  color: var(--fg-3);
}
.fn-item .bp-pip {
  width: 6px; height: 6px; border-radius: 50%; background: var(--rose); flex: 0 0 6px;
}

.str-item {
  padding: 6px 8px; border-radius: var(--radius-sm); cursor: pointer; margin-bottom: 2px;
  transition: background 120ms;
}
.str-item:hover { background: var(--surface-hover); }
.str-val {
  font-family: var(--mono); font-size: 11.5px; color: var(--c-str);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.str-meta {
  display: flex; justify-content: space-between; font-family: var(--mono);
  font-size: 10px; color: var(--fg-3); margin-top: 2px;
}

.sec-item {
  display: flex; align-items: center; gap: 6px; padding: 6px 8px;
  border-radius: var(--radius-sm); font-family: var(--mono); font-size: 11px;
}
.sec-item:hover { background: var(--surface-hover); }
.sec-perm {
  font-size: 10px; padding: 1px 5px; border-radius: 4px;
  background: var(--surface-3); color: var(--fg-2);
}
.sec-perm.exec { background: var(--accent-soft); color: var(--c-call); }
.sec-perm.rw { background: var(--amber-soft); color: var(--amber); }

/* ════════ 中央工作台 ════════ */
.center-col { flex: 1; min-width: 320px; display: flex; flex-direction: column; overflow: hidden; }

.stage-bar {
  height: 38px; flex: 0 0 38px;
  display: flex; align-items: center; gap: 6px; padding: 0 10px;
  background: var(--surface); border-bottom: 1px solid var(--line);
  overflow-x: auto; scrollbar-width: none;
}
.stage-bar::-webkit-scrollbar { display: none; }
.mode-tabs {
  display: inline-flex; align-items: center; gap: 2px; flex: 0 0 auto;
  padding: 2px; border-radius: 7px; background: var(--surface-2);
  border: 1px solid var(--line);
}
.mode-tab {
  height: 24px; padding: 0 8px; border: none; border-radius: 5px;
  background: transparent; color: var(--fg-2); font-size: 12px; font-weight: 500;
  display: inline-flex; align-items: center; gap: 4px; cursor: pointer; white-space: nowrap;
  transition: all 140ms var(--ease-out);
}
.mode-tab:hover { color: var(--fg); }
.mode-tab.on { background: var(--surface-3); color: var(--fg); box-shadow: 0 1px 2px rgba(0,0,0,0.18); }
.mode-tab .hint-k { font-family: var(--mono); font-size: 10px; color: var(--fg-3); }

.fn-actions { margin-left: auto; display: flex; align-items: center; gap: 4px; flex: 0 0 auto; }
.act-btn {
  height: 26px; padding: 0 8px; border-radius: var(--radius-sm);
  border: 1px solid var(--line); background: var(--surface-2);
  color: var(--fg-2); font-size: 11.5px; font-weight: 500; white-space: nowrap;
  display: inline-flex; align-items: center; gap: 4px; cursor: pointer;
  transition: all 130ms var(--ease-out);
}
.act-btn:hover { background: var(--surface-3); color: var(--fg); border-color: var(--line-strong); }
.act-btn.armed { border-color: color-mix(in srgb, var(--rose) 50%, transparent); background: var(--rose-soft); color: var(--rose); }

.stage-body { flex: 1; min-height: 0; position: relative; display: flex; overflow: hidden; background: var(--bg); }

/* ════════ 反汇编 & 伪代码并排视图 ════════ */
.split-view { flex: 1; display: flex; min-width: 0; min-height: 0; overflow: hidden; }
.code-pane {
  flex: 1; min-width: 0; display: flex; flex-direction: column;
  background: var(--bg); overflow: hidden;
}
.code-pane + .code-pane { border-left: 1px solid var(--line); }
.pane-hd {
  height: 30px; flex: 0 0 30px; padding: 0 10px;
  display: flex; align-items: center; gap: 6px;
  background: var(--surface-2); border-bottom: 1px solid var(--line);
  font-size: 11.5px; color: var(--fg-2);
  white-space: nowrap; overflow: hidden;
}
.pane-hd strong { color: var(--fg); font-weight: 600; flex: 0 0 auto; }
.pane-hd .tag {
  font-family: var(--mono); font-size: 10.5px; padding: 1px 6px; border-radius: 4px;
  background: var(--surface-3); color: var(--fg-2); flex: 0 0 auto;
}
.pane-hd .pane-hint {
  margin-left: auto; font-size: 11px; color: var(--fg-3);
  overflow: hidden; text-overflow: ellipsis; min-width: 0;
}
.pane-scroll { flex: 1; overflow: auto; padding: 8px 0 24px; user-select: text; }

.fn-banner {
  padding: 6px 14px 10px; margin-bottom: 4px;
  border-bottom: 1px dashed var(--line);
  font-family: var(--mono); font-size: 12px;
}
.fn-banner .sig { color: var(--c-call); font-weight: 600; font-size: 13px; }
.fn-banner .sub { color: var(--fg-3); font-size: 11px; margin-top: 2px; }

.insn-row {
  display: grid;
  grid-template-columns: 18px 64px 80px 62px minmax(120px, 1fr) auto;
  align-items: baseline; gap: 8px;
  padding: 2px 12px; line-height: 21px;
  font-family: var(--mono); font-size: 12px;
  cursor: pointer; transition: background 100ms;
}
/* 并排模式下自动隐藏原始字节列，为指令和行内注释留足阅读宽度 */
.split-view.is-split .insn-row {
  grid-template-columns: 16px 58px 56px minmax(100px, 1fr) auto;
  gap: 6px; padding: 2px 10px;
}
.split-view.is-split .insn-bytes { display: none; }
.split-view.is-split .insn-cmt { max-width: 150px; }
.insn-row:hover { background: var(--surface-hover); }
.insn-row.sel { background: var(--accent-soft); }
.insn-row.sync-hi { background: color-mix(in srgb, var(--amber) 14%, transparent); }
.insn-bp {
  width: 14px; height: 14px; display: inline-grid; place-items: center;
  color: transparent; font-size: 9px;
}
.insn-row:hover .insn-bp { color: var(--fg-3); }
.insn-row.has-bp .insn-bp { color: var(--rose); }
.insn-addr { color: var(--fg-3); font-size: 11.5px; }
.insn-bytes { color: color-mix(in srgb, var(--fg-3) 68%, transparent); font-size: 11px; }
.insn-mnem { font-weight: 600; color: var(--fg); }
.insn-mnem.k-call { color: var(--c-call); }
.insn-mnem.k-branch { color: var(--c-branch); }
.insn-mnem.k-ret { color: var(--c-ret); }
.insn-mnem.k-mem { color: var(--c-mem); }
.insn-ops { color: var(--c-reg); white-space: pre; }
.tok-reg { color: var(--c-reg); }
.tok-imm { color: var(--c-imm); }
.tok-target {
  color: var(--c-call); text-decoration: underline; text-underline-offset: 2px;
  text-decoration-color: color-mix(in srgb, var(--c-call) 45%, transparent);
  cursor: pointer;
}
.tok-target:hover { color: var(--accent); text-decoration-color: var(--accent); }
.insn-cmt {
  color: var(--c-cmt); font-size: 11.5px; white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis; max-width: 280px;
}
.insn-cmt.is-str { color: var(--c-str); }
.insn-cmt.is-user { color: var(--amber); font-style: italic; }

/* 伪代码行（带源地址双向高亮） */
.pc-line {
  display: grid; grid-template-columns: 62px 1fr; gap: 10px;
  padding: 1.5px 14px; line-height: 21px;
  font-family: var(--mono); font-size: 12px;
  cursor: pointer; transition: background 100ms;
}
.pc-line:hover { background: var(--surface-hover); }
.pc-line.sync-hi { background: color-mix(in srgb, var(--amber) 14%, transparent); }
.pc-src { color: var(--fg-3); font-size: 11px; text-align: right; }
.pc-code { white-space: pre; color: var(--fg); }
.pc-kw { color: var(--c-kw); font-weight: 600; }
.pc-fn { color: var(--c-call); }
.pc-str { color: var(--c-str); }
.pc-num { color: var(--c-imm); }
.pc-cmt { color: var(--c-cmt); }

/* ════════ 可缩放平移画布（CFG 控制流图 & 跨 SO 图谱共用） ════════ */
.canvas-view {
  flex: 1; position: relative; overflow: hidden;
  background-color: var(--bg);
  background-image: radial-gradient(color-mix(in srgb, var(--fg-3) 20%, transparent) 1px, transparent 1px);
  background-size: 20px 20px;
  cursor: grab;
}
.canvas-view:active { cursor: grabbing; }
.canvas-svg { width: 100%; height: 100%; display: block; }
.canvas-tools {
  position: absolute; right: 14px; top: 12px; z-index: 5;
  display: flex; align-items: center; gap: 4px;
  padding: 4px; border-radius: var(--radius-md);
  background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow-sm);
}
.canvas-legend {
  position: absolute; left: 14px; bottom: 12px; z-index: 5;
  display: flex; align-items: center; gap: 12px;
  padding: 6px 10px; border-radius: var(--radius-md);
  background: var(--surface); border: 1px solid var(--line);
  font-size: 11px; color: var(--fg-2);
}
.leg-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 5px; vertical-align: -1px; }

.cfg-block { cursor: pointer; }
.cfg-block rect.box {
  fill: var(--surface); stroke: var(--line-strong); stroke-width: 1.2; rx: 8;
  transition: stroke 140ms;
}
.cfg-block:hover rect.box { stroke: var(--accent); }
.cfg-block.entry rect.box { stroke: var(--accent); stroke-width: 1.6; }
.cfg-block rect.hd { fill: var(--surface-2); }
.cfg-hd-txt { fill: var(--fg-2); font-family: var(--mono); font-size: 10.5px; font-weight: 600; }
.cfg-ins-txt { fill: var(--fg); font-family: var(--mono); font-size: 11px; }
.cfg-ins-addr { fill: var(--fg-3); font-family: var(--mono); font-size: 10px; }

.xnode { cursor: pointer; }
.xnode rect {
  fill: var(--surface); stroke: var(--line-strong); stroke-width: 1.2; rx: 8;
  transition: stroke 140ms, fill 140ms;
}
.xnode:hover rect { stroke: var(--accent); fill: var(--surface-2); }
.xnode.center rect { stroke: var(--accent); stroke-width: 1.8; fill: var(--accent-soft); }
.xnode.cross rect { stroke: color-mix(in srgb, var(--violet) 65%, transparent); }

/* ════════ 全局 AI 操控特效层（流光能量条 / 悬浮迷你雷达 / 扫光 / 冻结定格光晕） ════════ */
.ai-beam {
  height: 2px; flex: 0 0 2px; position: relative; overflow: hidden;
  background: transparent; opacity: 0; transition: opacity 220ms var(--ease-out);
}
.ai-beam.on { opacity: 1; background: color-mix(in srgb, var(--beam-col, var(--accent)) 18%, transparent); }
.ai-beam::after {
  content: ""; position: absolute; top: 0; bottom: 0; width: 32%;
  background: linear-gradient(90deg, transparent, var(--beam-col, var(--accent)), #fff, var(--beam-col, var(--accent)), transparent);
  transform: translateX(-120%);
}
.ai-beam.on::after { animation: beamSweep 1.15s linear infinite; }
@keyframes beamSweep {
  0% { transform: translateX(-120%); }
  100% { transform: translateX(420%); }
}

.heat-sweep {
  position: absolute; top: -3px; bottom: -3px; width: 28px; pointer-events: none;
  background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--accent) 80%, #fff), transparent);
  opacity: 0; transform: translateX(-100%);
}
.heat-sweep.go { animation: heatRadar 680ms var(--ease-out); }
@keyframes heatRadar {
  0% { opacity: 0.95; left: 0%; transform: translateX(-50%); }
  100% { opacity: 0; left: 100%; transform: translateX(-50%); }
}

.insn-row.ai-hit, .pc-line.ai-hit {
  position: relative;
  animation: codeScanHit 1150ms var(--ease-out);
}
@keyframes codeScanHit {
  0% { background: color-mix(in srgb, var(--accent) 36%, transparent); box-shadow: inset 3px 0 0 var(--accent); }
  55% { background: color-mix(in srgb, var(--accent) 18%, transparent); box-shadow: inset 3px 0 0 var(--accent); }
  100% { background: transparent; box-shadow: inset 0 0 0 transparent; }
}

.stage-body.aura-freeze { animation: auraFreeze 850ms var(--ease-out); }
.stage-body.aura-hit { animation: auraHit 750ms var(--ease-out); }
.stage-body.aura-hook { animation: auraHook 800ms var(--ease-out); }
@keyframes auraFreeze {
  0% { box-shadow: inset 0 0 0 2px #38bdf8, inset 0 0 42px rgba(56, 189, 248, 0.34); }
  100% { box-shadow: inset 0 0 0 0 transparent; }
}
@keyframes auraHit {
  0% { box-shadow: inset 0 0 0 2px var(--rose), inset 0 0 42px rgba(251, 113, 133, 0.32); }
  100% { box-shadow: inset 0 0 0 0 transparent; }
}
@keyframes auraHook {
  0% { box-shadow: inset 0 0 0 2px var(--violet), inset 0 0 38px rgba(167, 139, 250, 0.28); }
  100% { box-shadow: inset 0 0 0 0 transparent; }
}

/* 跨视图悬浮 AI 操控迷你雷达 HUD（仅在非工具流视图且 AI 触发操控时浮现） */
.device-hud {
  position: fixed; right: 18px; bottom: 34px; z-index: 90;
  width: 318px; padding: 10px 12px; border-radius: var(--radius-lg);
  background: color-mix(in srgb, var(--surface) 92%, transparent);
  backdrop-filter: blur(12px);
  border: 1px solid color-mix(in srgb, var(--hud-col, var(--accent)) 52%, var(--line));
  box-shadow: var(--shadow-lg), 0 0 24px color-mix(in srgb, var(--hud-col, var(--accent)) 22%, transparent);
  opacity: 0; pointer-events: none; transform: translateY(12px) scale(0.97);
  transition: opacity 220ms var(--ease-out), transform 220ms var(--ease-out);
}
.device-hud.show { opacity: 1; pointer-events: auto; transform: translateY(0) scale(1); }
.hud-top { display: flex; align-items: center; gap: 7px; margin-bottom: 6px; }
.hud-title { font-family: var(--mono); font-size: 12px; font-weight: 650; color: var(--fg); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hud-sub { font-size: 11px; color: var(--fg-2); margin-bottom: 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hud-track {
  height: 22px; display: flex; align-items: center; gap: 8px;
  padding: 0 8px; border-radius: 6px; background: var(--surface-2); border: 1px solid var(--line);
  font-family: var(--mono); font-size: 10.5px; color: var(--fg-2);
}
.hud-wire { flex: 1; height: 4px; border-radius: 99px; background: var(--surface-3); position: relative; overflow: hidden; }
.hud-wire::after {
  content: ""; position: absolute; top: 0; bottom: 0; width: 42%; border-radius: 99px;
  background: var(--hud-col, var(--accent));
  box-shadow: 0 0 8px var(--hud-col, var(--accent));
  animation: hudPacket 780ms linear infinite;
}
@keyframes hudPacket {
  0% { left: -45%; }
  100% { left: 105%; }
}

/* ════════ AI 实时工具流 & 设备操控动画舞台 ════════ */
.live-view { flex: 1; display: flex; flex-direction: column; min-height: 0; overflow: hidden; position: relative; }
.live-bar {
  padding: 6px 12px; display: flex; align-items: center; gap: 6px; flex-wrap: nowrap;
  border-bottom: 1px solid var(--line); background: var(--surface-2);
  overflow-x: auto; scrollbar-width: none; flex: 0 0 auto;
}
.live-bar::-webkit-scrollbar { display: none; }
.fx-btn {
  height: 24px; padding: 0 8px; border-radius: 5px;
  border: 1px solid var(--line); background: var(--surface);
  color: var(--fg-2); font-size: 11px; font-weight: 500; cursor: pointer;
  display: inline-flex; align-items: center; gap: 4px; white-space: nowrap;
  transition: all 140ms var(--ease-out);
}
.fx-btn:hover { border-color: var(--accent); color: var(--fg); background: var(--surface-3); }
.fx-btn.pri {
  background: var(--accent); color: #fff; border-color: transparent; font-weight: 600;
  box-shadow: 0 2px 10px color-mix(in srgb, var(--accent) 36%, transparent);
}
.fx-btn.pri:hover { filter: brightness(1.08); }
.fx-btn.running { background: var(--rose-soft); color: var(--rose); border-color: color-mix(in srgb, var(--rose) 48%, transparent); }

/* 设备操控实时链路动画舞台（方向 2：精细仪器感运行态监控面板） */
.ops-deck {
  flex: 0 0 auto; padding: 7px 12px;
  background: radial-gradient(ellipse at 50% 0%, color-mix(in srgb, var(--accent) 6%, transparent), transparent 72%), var(--surface);
  border-bottom: 1px solid var(--line);
  display: grid; grid-template-columns: 196px minmax(110px, 184px) minmax(420px, 1fr); gap: 8px; align-items: center;
  position: relative; overflow: hidden;
}
.ops-deck.collapsed { display: none; }
.ai-core-card {
  padding: 8px 10px; border-radius: 8px;
  background: var(--surface-2); border: 1px solid var(--line);
  display: flex; align-items: center; gap: 9px; position: relative;
  transition: border-color 180ms var(--ease-out), box-shadow 180ms var(--ease-out);
}
.ai-core-card.firing {
  border-color: color-mix(in srgb, var(--ops-col, var(--accent)) 55%, var(--line));
  box-shadow: 0 2px 12px color-mix(in srgb, var(--ops-col, var(--accent)) 18%, transparent);
}
/* 精致极简 AI 芯片徽标（替代粗糙虚线同心圆） */
.ai-emblem {
  width: 34px; height: 34px; flex: 0 0 34px; border-radius: 8px;
  position: relative; overflow: hidden; display: grid; place-items: center;
  background: linear-gradient(145deg, color-mix(in srgb, var(--ops-col, var(--accent)) 16%, var(--surface)), var(--surface-2));
  border: 1px solid color-mix(in srgb, var(--ops-col, var(--accent)) 36%, var(--line));
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.08);
  transition: border-color 200ms, box-shadow 200ms;
}
.ai-emblem svg { width: 17px; height: 17px; position: relative; z-index: 2; }
.ai-emblem::after {
  content: ""; position: absolute; inset: -40%; pointer-events: none;
  background: linear-gradient(115deg, transparent 35%, color-mix(in srgb, var(--ops-col, var(--accent)) 36%, #fff) 50%, transparent 65%);
  transform: translateX(-100%); opacity: 0;
}
.ai-core-card.firing .ai-emblem {
  border-color: var(--ops-col, var(--accent));
  box-shadow: 0 0 12px color-mix(in srgb, var(--ops-col, var(--accent)) 28%, transparent);
}
.ai-core-card.firing .ai-emblem::after {
  opacity: 1; animation: emblemShimmer 720ms var(--ease-out);
}
@keyframes emblemShimmer {
  0% { transform: translateX(-90%); }
  100% { transform: translateX(90%); }
}
.core-meta { min-width: 0; flex: 1; }
.core-label { font-size: 9.5px; letter-spacing: 0.04em; color: var(--fg-3); display: flex; align-items: center; gap: 5px; }
.core-tool {
  font-family: var(--mono); font-size: 11.5px; font-weight: 600; color: var(--fg);
  margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.core-sub {
  font-family: var(--mono); font-size: 10px; color: var(--fg-3); margin-top: 1px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}

.ops-conduit-wrap { position: relative; height: 126px; display: flex; align-items: center; }
.ops-conduit { width: 100%; height: 126px; display: block; overflow: visible; }
/* 纤细精密 1px 信号总线轨道 */
.conduit-rail { fill: none; stroke: color-mix(in srgb, var(--fg-3) 26%, transparent); stroke-width: 1; stroke-dasharray: 2.5 4; }
.conduit-ambient {
  fill: none; stroke-width: 1.35; stroke-dasharray: 5 6; opacity: 0.78;
  animation: conduitFlow 1.15s linear infinite;
}
@keyframes conduitFlow { to { stroke-dashoffset: -22; } }
.conduit-beam {
  fill: none; stroke-width: 1.7; stroke-linecap: round;
  opacity: 0; transition: opacity 220ms;
}
.conduit-beam.lit { opacity: 0.92; }
.usb-tag {
  position: absolute; left: 50%; bottom: 2px; transform: translateX(-50%);
  font-family: var(--mono); font-size: 9px; color: var(--fg-3);
  background: var(--surface); border: 1px solid var(--line);
  padding: 0 6px; line-height: 16px; border-radius: 4px; white-space: nowrap;
  display: inline-flex; align-items: center; gap: 4px;
}

/* 右侧：真实设备运行态监控控制台（铭牌状态栏 + 2x2 运行态子系统卡片矩阵） */
.dev-console {
  border-radius: 10px; padding: 7px 9px;
  background: var(--surface-2); border: 1px solid var(--line-strong);
  position: relative; overflow: hidden;
  transition: border-color 180ms, box-shadow 180ms;
}
.dev-console.active-pulse {
  border-color: var(--dev-col, var(--accent));
  box-shadow: 0 0 18px color-mix(in srgb, var(--dev-col, var(--accent)) 22%, transparent);
}
.dev-console.frozen {
  border-color: #0284c7;
  box-shadow: 0 0 22px rgba(56, 189, 248, 0.34), inset 0 0 24px rgba(56, 189, 248, 0.14);
}
.dev-console.frozen::after {
  content: "❄ SIGSTOP · 目标进程已冻结"; position: absolute; inset: 0; z-index: 8;
  display: grid; place-items: center; pointer-events: none;
  background: repeating-linear-gradient(135deg, rgba(56,189,248,0.14) 0 7px, rgba(14,165,233,0.04) 7px 14px);
  backdrop-filter: blur(1px);
  color: #0284c7; font-family: var(--mono); font-size: 12px; font-weight: 800; letter-spacing: 0.08em;
  text-shadow: 0 0 14px rgba(56,189,248,0.65);
  animation: frostPulse 1.35s var(--ease-out);
}
[data-theme="dark"] .dev-console.frozen::after { color: #bae6fd; }
@keyframes frostPulse {
  0% { opacity: 0; }
  18% { opacity: 1; }
  82% { opacity: 0.92; }
  100% { opacity: 0; }
}
.dev-console.hit-shake { animation: consoleShake 320ms var(--ease-out); }
@keyframes consoleShake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-2.5px); }
  55% { transform: translateX(2.5px); }
  80% { transform: translateX(-1px); }
}

/* 顶部设备铭牌栏 */
.dc-top {
  display: flex; align-items: center; gap: 6px; margin-bottom: 6px;
  padding-bottom: 5px; border-bottom: 1px solid var(--line);
  font-size: 11px; flex-wrap: nowrap; overflow: hidden;
}
.dc-name { font-weight: 650; color: var(--fg); white-space: nowrap; display: inline-flex; align-items: center; gap: 5px; }
.dc-led { width: 7px; height: 7px; border-radius: 50%; background: var(--green); flex: 0 0 7px; }
.dc-led.blink { animation: ledBlink 220ms linear 4; }
@keyframes ledBlink {
  0%, 100% { opacity: 1; transform: scale(1.25); box-shadow: 0 0 8px var(--green); }
  50% { opacity: 0.3; transform: scale(0.85); }
}
.dc-pill {
  font-family: var(--mono); font-size: 10px; padding: 1px 6px; border-radius: 4px;
  background: var(--surface); border: 1px solid var(--line); color: var(--fg-2);
  white-space: nowrap; display: inline-flex; align-items: center; gap: 4px;
}
.dc-pill i { width: 5px; height: 5px; border-radius: 50%; background: var(--fg-3); }
.dc-pill.ok i { background: var(--green); }
.dc-pill.warn { border-color: color-mix(in srgb, var(--rose) 50%, transparent); color: var(--rose); background: var(--rose-soft); }
.dc-pill.warn i { background: var(--rose); }
.dc-state {
  margin-left: auto; font-family: var(--mono); font-size: 10px; font-weight: 650;
  padding: 1px 7px; border-radius: 99px; white-space: nowrap;
  max-width: 148px; overflow: hidden; text-overflow: ellipsis;
  background: var(--surface-3); color: var(--fg-2);
}
.dc-state.live { background: var(--accent-soft); color: var(--accent); }
.dc-state.frozen { background: rgba(56, 189, 248, 0.18); color: #0284c7; }
[data-theme="dark"] .dc-state.frozen { color: #7dd3fc; }
.dc-state.hit { background: var(--rose-soft); color: var(--rose); }

/* 2x2 运行态子系统监控卡 */
.dc-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.sub-card {
  padding: 6px 8px; border-radius: 7px; position: relative; overflow: hidden;
  background: var(--surface); border: 1px solid var(--line);
  transition: border-color 160ms, box-shadow 160ms, background 160ms;
}
.sub-card.ping {
  border-color: var(--sub-col, var(--accent));
  box-shadow: 0 0 0 1px color-mix(in srgb, var(--sub-col, var(--accent)) 35%, transparent),
              0 0 14px color-mix(in srgb, var(--sub-col, var(--accent)) 22%, transparent);
}
.sub-card.ping::before {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--sub-col, var(--accent)) 26%, transparent), transparent);
  animation: subSweep 640ms var(--ease-out);
}
@keyframes subSweep {
  0% { transform: translateX(-100%); }
  100% { transform: translateX(100%); }
}
.sub-card.strobe { animation: vmStrobe 220ms linear 4; }
@keyframes vmStrobe {
  0%, 100% { border-color: #06b6d4; background: rgba(34,211,238,0.14); }
  50% { border-color: var(--line); background: var(--surface); }
}

.sc-hd { display: flex; align-items: center; justify-content: space-between; gap: 4px; margin-bottom: 4px; }
.sc-title { font-size: 10.5px; font-weight: 650; color: var(--fg); display: inline-flex; align-items: center; gap: 5px; }
.sc-dot { width: 6px; height: 6px; border-radius: 50%; flex: 0 0 6px; }
.sc-tag { font-family: var(--mono); font-size: 9.5px; color: var(--fg-3); }

/* 卡0：进程 & 链路行 */
.sc-kv { display: flex; align-items: center; justify-content: space-between; gap: 6px; font-family: var(--mono); font-size: 10px; color: var(--fg-2); }
.sc-kv b { color: var(--fg); font-weight: 600; }

/* 卡1：8 枚迷你 Hook 探针 LED 矩阵 */
.mini-leds { display: grid; grid-template-columns: repeat(8, 1fr); gap: 3px; margin-top: 2px; }
.m-led {
  height: 14px; border-radius: 3px; display: grid; place-items: center;
  font-family: var(--mono); font-size: 8px; color: var(--fg-3);
  background: var(--surface-2); border: 1px solid var(--line);
  transition: all 180ms var(--ease-out);
}
.m-led.on {
  background: var(--green-soft); border-color: color-mix(in srgb, var(--green) 58%, transparent);
  color: var(--green); font-weight: 700;
}
.m-led.ign { animation: ledIgnite 560ms var(--ease-out); }
@keyframes ledIgnite {
  0% { transform: scale(1.22); box-shadow: 0 0 10px var(--green); }
  100% { transform: scale(1); box-shadow: none; }
}

/* 卡2：Native SO 真实内存区段扫描条 */
.mem-strip {
  height: 14px; border-radius: 4px; position: relative; overflow: hidden;
  background: var(--surface-2); border: 1px solid var(--line);
  display: flex; align-items: stretch; gap: 2px; padding: 2px;
}
.mem-seg {
  border-radius: 2px; font-family: var(--mono); font-size: 8.5px; color: #fff;
  display: flex; align-items: center; padding: 0 4px; overflow: hidden; white-space: nowrap;
}
.mem-seg.log { flex: 1; background: color-mix(in srgb, var(--accent) 78%, transparent); }
.mem-seg.base { flex: 1.35; background: color-mix(in srgb, var(--violet) 78%, transparent); }
.mem-laser {
  position: absolute; top: 0; bottom: 0; width: 14px; left: -16px; pointer-events: none;
  background: linear-gradient(90deg, transparent, #fbbf24, #fff, #fbbf24, transparent);
  opacity: 0;
}
.mem-laser.go { animation: memLaserX 720ms var(--ease-out); }
@keyframes memLaserX {
  0% { left: -10%; opacity: 1; }
  100% { left: 105%; opacity: 0.2; }
}

/* 卡3：ARM64 核心寄存器与断点锁定槽 */
.reg-row { display: grid; grid-template-columns: 1.85fr 1fr 1fr 1fr; gap: 3px; }
.reg-cell {
  padding: 1.5px 4px; border-radius: 3px; background: var(--surface-2); border: 1px solid var(--line);
  font-family: var(--mono); font-size: 9px; display: flex; justify-content: space-between; gap: 2px;
  overflow: hidden;
}
.reg-cell span { color: var(--fg-3); }
.reg-cell b { color: var(--fg); font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
.reg-cell.pc-hot { border-color: color-mix(in srgb, var(--rose) 58%, transparent); background: var(--rose-soft); }
.reg-cell.pc-hot b { color: var(--rose); }

/* 三栏实时监控主区（目标/Hook墙 | 事件流+活动密度泳道 | 详情面板） */
.mon-grid {
  flex: 1; min-height: 0; display: grid;
  grid-template-columns: 204px minmax(0, 1fr) 290px;
  overflow: hidden; position: relative;
}
.fx-layer {
  position: absolute; inset: 0; width: 100%; height: 100%;
  pointer-events: none; z-index: 20; overflow: visible;
}
.fx-arc {
  fill: none; stroke-width: 2; stroke-linecap: round;
  stroke-dasharray: 420; stroke-dashoffset: 420;
  animation: arcShoot 860ms var(--ease-out) forwards;
}
@keyframes arcShoot {
  0% { stroke-dashoffset: 420; opacity: 0.95; }
  55% { stroke-dashoffset: 0; opacity: 0.95; }
  100% { stroke-dashoffset: 0; opacity: 0; }
}

.mon-left {
  border-right: 1px solid var(--line); background: var(--surface);
  overflow-y: auto; padding: 8px; display: flex; flex-direction: column; gap: 10px;
}
.mon-sec-hd {
  font-size: 11px; font-weight: 600; color: var(--fg-3);
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 5px; padding: 0 2px;
}
.target-card {
  padding: 7px 8px; border-radius: 6px; position: relative;
  background: var(--surface-2); border: 1px solid var(--line);
  margin-bottom: 5px; cursor: pointer; transition: border-color 140ms, background 140ms;
}
.target-card:hover { border-color: var(--line-strong); background: var(--surface-3); }
.target-card.hit-ping { animation: tgtPing 850ms var(--ease-out); }
@keyframes tgtPing {
  0% { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 30%, transparent); }
  100% { border-color: var(--line); box-shadow: 0 0 0 0 transparent; }
}
.target-dot-fx {
  position: absolute; right: 6px; top: 6px; width: 8px; height: 8px; border-radius: 50%;
  background: var(--accent); pointer-events: none;
  animation: dotBurst 800ms var(--ease-out) forwards;
}
@keyframes dotBurst {
  0% { transform: scale(0.6); opacity: 1; box-shadow: 0 0 0 0 var(--accent); }
  100% { transform: scale(1.6); opacity: 0; box-shadow: 0 0 0 10px transparent; }
}
.target-nm { font-family: var(--mono); font-size: 11.5px; font-weight: 600; color: var(--fg); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.target-sub { font-family: var(--mono); font-size: 10px; color: var(--fg-3); margin-top: 2px; display: flex; justify-content: space-between; }

.hook-wall { display: flex; flex-wrap: wrap; gap: 4px; }
.hk-chip {
  font-family: var(--mono); font-size: 10.5px; padding: 2px 6px; border-radius: 5px;
  border: 1px solid var(--line); background: var(--surface-2); color: var(--fg-3);
  transition: all 220ms var(--ease-out);
}
.hk-chip.on {
  border-color: color-mix(in srgb, var(--green) 52%, transparent);
  background: var(--green-soft); color: var(--green); font-weight: 600;
}
.hk-chip.poweron { animation: hkPower 620ms var(--ease-out); }
@keyframes hkPower {
  0% { transform: scale(1.14); box-shadow: 0 0 12px color-mix(in srgb, var(--green) 65%, transparent); }
  100% { transform: scale(1); box-shadow: none; }
}

.mon-center { display: flex; flex-direction: column; min-width: 0; min-height: 0; overflow: hidden; background: var(--bg); }
.cat-bar {
  padding: 4px 10px; display: flex; align-items: center; gap: 3px; flex-wrap: nowrap;
  border-bottom: 1px solid var(--line); background: var(--surface); overflow-x: auto; scrollbar-width: none;
}
.cat-bar::-webkit-scrollbar { display: none; }
.cat-pill {
  height: 20px; padding: 0 7px; border-radius: 4px; border: 1px solid transparent;
  background: transparent; color: var(--fg-2); font-size: 11px; cursor: pointer;
  display: inline-flex; align-items: center; gap: 4px; white-space: nowrap;
}
.cat-pill:hover { background: var(--surface-2); color: var(--fg); }
.cat-pill.on { background: var(--accent-soft); color: var(--accent); border-color: color-mix(in srgb, var(--accent) 28%, transparent); font-weight: 550; }
.cat-pill b { font-family: var(--mono); font-size: 10px; opacity: 0.8; }

/* 纤细高密度单行日志流（告别粗壮双行方框卡片） */
.live-list { flex: 1; overflow-y: auto; padding: 0; display: flex; flex-direction: column; gap: 0; background: var(--surface); }
.ev-card {
  display: flex; align-items: center; gap: 7px;
  height: 28px; flex: 0 0 28px; padding: 0 10px 0 8px;
  position: relative; cursor: pointer;
  border: none; border-bottom: 1px solid color-mix(in srgb, var(--line) 62%, transparent);
  border-left: 2px solid transparent;
  background: transparent;
  transition: background 100ms, border-left-color 120ms;
}
.ev-card:hover { background: var(--surface-hover); border-left-color: color-mix(in srgb, var(--ev-col, var(--accent)) 65%, transparent); }
.ev-card.sel { background: var(--accent-soft); border-left-color: var(--ev-col, var(--accent)); }
.ev-card.fresh { animation: rowSlideIn 240ms var(--ease-out); }
@keyframes rowSlideIn {
  from { opacity: 0; transform: translateY(-4px); background: color-mix(in srgb, var(--ev-col, var(--accent)) 14%, transparent); }
  to { opacity: 1; transform: none; }
}
.ev-dot { width: 5px; height: 5px; border-radius: 50%; flex: 0 0 5px; background: var(--ev-col, var(--accent)); }
.ev-ts { font-family: var(--mono); font-size: 10px; color: var(--fg-3); flex: 0 0 auto; }
.ev-tool { font-family: var(--mono); font-size: 11.5px; font-weight: 600; color: var(--fg); flex: 0 0 auto; }
.ev-badge {
  font-size: 9.5px; line-height: 15px; padding: 0 5px; border-radius: 4px; font-weight: 500;
  background: var(--surface-3); color: var(--fg-2); flex: 0 0 auto;
}
.ev-badge.static { background: var(--accent-soft); color: var(--c-call); }
.ev-badge.plugin, .ev-badge.behavior { background: var(--violet-soft); color: var(--violet); }
.ev-badge.proc, .ev-badge.trace { background: var(--green-soft); color: var(--green); }
.ev-badge.bp, .ev-badge.watch { background: var(--rose-soft); color: var(--rose); }
.ev-badge.mem, .ev-badge.runtime { background: var(--amber-soft); color: var(--amber); }
.ev-badge.vm, .ev-badge.java, .ev-badge.ui { background: rgba(56, 189, 248, 0.14); color: #0284c7; }
[data-theme="dark"] .ev-badge.vm, [data-theme="dark"] .ev-badge.java, [data-theme="dark"] .ev-badge.ui { color: #38bdf8; }
.ev-preview-tag {
  font-size: 9.5px; color: var(--fg-3); border: 1px solid var(--line); border-radius: 3px;
  padding: 0 4px; line-height: 14px; flex: 0 0 auto;
}
.ev-sub {
  flex: 1; min-width: 0; font-family: var(--sans); font-size: 11.5px; color: var(--fg-2);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.ev-ms { font-family: var(--mono); font-size: 10px; color: var(--fg-3); flex: 0 0 auto; text-align: right; min-width: 40px; }

/* 活动密度 6 通道泳道（紧凑 2 列×3 行布局，为上方事件流留足空间） */
.lanes-box {
  flex: 0 0 auto; padding: 5px 10px; border-top: 1px solid var(--line);
  background: var(--surface);
}
.lanes-hd { display: flex; justify-content: space-between; font-size: 10px; color: var(--fg-3); margin-bottom: 3px; }
.lanes-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 3px 14px; }
.lane-row { display: grid; grid-template-columns: 44px 1fr 18px; align-items: center; gap: 5px; height: 11px; }
.lane-nm { font-family: var(--mono); font-size: 9.5px; color: var(--fg-3); }
.lane-tr { display: flex; align-items: flex-end; gap: 2px; height: 11px; }
.lane-tr i { flex: 1; border-radius: 1.5px; background: var(--surface-3); min-height: 2px; transition: height 180ms var(--ease-out); }
.lane-tr i.lit { background: var(--lane-col, var(--accent)); }
.lane-cnt { font-family: var(--mono); font-size: 10px; color: var(--fg-3); text-align: right; }
.lane-cnt.has { color: var(--fg); font-weight: 600; }

/* 底部 ArmedBar 待命监控条 */
.armed-bar {
  flex: 0 0 auto; padding: 5px 12px; border-top: 1px solid var(--line);
  background: var(--surface-2); display: flex; align-items: center; gap: 8px;
  font-size: 11px; color: var(--fg-2); overflow-x: auto; scrollbar-width: none;
}
.armed-bar::-webkit-scrollbar { display: none; }
.arm-chip {
  font-family: var(--mono); font-size: 10.5px; padding: 1px 7px; border-radius: 99px;
  background: var(--surface); border: 1px solid var(--line); color: var(--fg); white-space: nowrap;
}
.arm-chip.bp { border-color: color-mix(in srgb, var(--rose) 48%, transparent); color: var(--rose); background: var(--rose-soft); }
.arm-chip.hk { border-color: color-mix(in srgb, var(--green) 48%, transparent); color: var(--green); background: var(--green-soft); }

.live-detail {
  border-left: 1px solid var(--line); background: var(--surface);
  padding: 10px 12px; overflow-y: auto; user-select: text;
}
.live-detail pre {
  margin: 5px 0 10px; padding: 8px 10px; border-radius: var(--radius-sm);
  background: var(--surface-2); border: 1px solid var(--line);
  font-family: var(--mono); font-size: 11px; color: var(--fg);
  overflow-x: auto; white-space: pre-wrap; word-break: break-all;
}

/* ════════ 全部 137 个 MCP 工具目录视图（完整还原并升级） ════════ */
.tools-view { flex: 1; display: flex; flex-direction: column; min-height: 0; overflow: hidden; background: var(--bg); }
.tv-bar {
  padding: 8px 12px; display: flex; align-items: center; gap: 8px; flex-wrap: nowrap;
  border-bottom: 1px solid var(--line); background: var(--surface-2); overflow-x: auto; scrollbar-width: none;
}
.tv-bar::-webkit-scrollbar { display: none; }
.tv-search {
  width: 240px; flex: 0 0 240px; height: 28px; padding: 0 9px; border-radius: 6px;
  border: 1px solid var(--line); background: var(--surface); color: var(--fg);
  font-size: 12px; outline: none; font-family: var(--sans);
}
.tv-search:focus { border-color: var(--accent); }
.tv-body { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 316px; overflow: hidden; }
.tv-list { overflow-y: auto; padding: 6px 8px; }
.tv-row {
  display: grid; grid-template-columns: 185px 54px minmax(0, 1fr) 54px 52px;
  align-items: center; gap: 8px; padding: 6px 10px; border-radius: 6px;
  cursor: pointer; transition: background 110ms;
}
.tv-row:hover { background: var(--surface-hover); }
.tv-row.sel { background: var(--accent-soft); }
.tv-row.busy { animation: codeScanHit 1200ms var(--ease-out); }
.tv-name { font-family: var(--mono); font-size: 12px; font-weight: 600; color: var(--fg); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tv-desc { font-size: 12px; color: var(--fg-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tv-cnt { font-family: var(--mono); font-size: 11px; color: var(--fg-3); text-align: right; }
.tv-cnt.has { color: var(--accent); font-weight: 650; }
.tv-fx-mini {
  height: 20px; padding: 0 6px; border-radius: 4px; border: 1px solid var(--line);
  background: var(--surface-2); color: var(--fg-2); font-size: 10px; cursor: pointer;
  opacity: 0.72; transition: all 120ms;
}
.tv-row:hover .tv-fx-mini { opacity: 1; border-color: var(--accent); color: var(--accent); }
.tv-detail {
  border-left: 1px solid var(--line); background: var(--surface);
  padding: 14px; overflow-y: auto; user-select: text;
}
.tvd-hd { font-family: var(--mono); font-size: 14px; font-weight: 700; color: var(--fg); word-break: break-all; }
.tvd-sec { font-size: 11px; font-weight: 600; color: var(--fg-3); margin: 12px 0 5px; }
.tvd-desc { font-size: 12.5px; color: var(--fg-2); line-height: 1.55; }
.tvd-params { display: flex; flex-wrap: wrap; gap: 5px; }
.tvd-par {
  font-family: var(--mono); font-size: 11px; padding: 2px 7px; border-radius: 5px;
  background: var(--surface-2); border: 1px solid var(--line); color: var(--fg-2);
}
.tvd-par.req {
  border-color: color-mix(in srgb, var(--accent) 52%, transparent);
  background: var(--accent-soft); color: var(--c-call); font-weight: 600;
}

/* ════════ 底部可拖拽抽屉（插件分析 + Frida 终端） ════════ */
.drawer {
  height: var(--drawer-h, 196px); flex: 0 0 auto; min-height: 0;
  display: flex; flex-direction: column;
  background: var(--surface); border-top: 1px solid var(--line);
  overflow: hidden; transition: height 180ms var(--ease-out);
}
.drawer.collapsed { height: 0 !important; border-top: none; }
.drawer-hd {
  height: 32px; flex: 0 0 32px; padding: 0 12px;
  display: flex; align-items: center; gap: 8px;
  background: var(--surface-2); border-bottom: 1px solid var(--line);
}
.dtab {
  height: 22px; padding: 0 9px; border: none; border-radius: 5px;
  background: transparent; color: var(--fg-2); font-size: 11.5px; font-weight: 500;
  cursor: pointer; display: inline-flex; align-items: center; gap: 5px;
}
.dtab:hover { color: var(--fg); background: var(--surface-3); }
.dtab.on { background: var(--accent-soft); color: var(--accent); }
.drawer-body { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }

/* 底部 Frida 终端 */
.term-out {
  flex: 1; overflow-y: auto; padding: 8px 14px;
  font-family: var(--mono); font-size: 12px; line-height: 1.6;
  background: var(--bg); user-select: text;
}
.term-line.sys { color: var(--fg-3); }
.term-line.out { color: var(--fg); }
.term-line.cmd { color: var(--c-call); }
.term-bar {
  display: flex; align-items: center; gap: 8px; padding: 6px 12px;
  background: var(--surface); border-top: 1px solid var(--line);
}
.term-bar textarea {
  flex: 1; height: 28px; max-height: 80px; resize: none;
  padding: 5px 8px; border-radius: 6px;
  border: 1px solid var(--line); background: var(--surface-2);
  color: var(--fg); font-family: var(--mono); font-size: 12px; outline: none;
}
.term-bar textarea:focus { border-color: var(--accent); }

/* 底部插件快捷结果区 */
.plug-wrap { flex: 1; display: flex; min-height: 0; overflow: hidden; }
.plug-nav {
  width: 170px; flex: 0 0 170px; border-right: 1px solid var(--line);
  padding: 6px; overflow-y: auto; background: var(--surface-2);
}
.plug-btn {
  width: 100%; text-align: left; padding: 6px 8px; border: none;
  border-radius: 5px; background: transparent; color: var(--fg-2);
  font-size: 12px; cursor: pointer; display: flex; align-items: center; justify-content: space-between;
}
.plug-btn:hover { background: var(--surface-3); color: var(--fg); }
.plug-btn.on { background: var(--accent-soft); color: var(--accent); font-weight: 500; }
.plug-out {
  flex: 1; overflow: auto; padding: 10px 14px; background: var(--bg);
  font-family: var(--mono); font-size: 11.5px; line-height: 1.6; user-select: text;
}
.plug-tbl { width: 100%; border-collapse: collapse; font-family: var(--mono); font-size: 11.5px; }
.plug-tbl th, .plug-tbl td {
  text-align: left; padding: 5px 10px; border-bottom: 1px solid var(--line);
}
.plug-tbl th { color: var(--fg-3); font-family: var(--sans); font-weight: 500; font-size: 11px; }

/* ════════ 右侧检视器 ════════ */
.inspector {
  width: var(--right-w, 292px); flex: 0 0 auto; min-width: 0;
  display: flex; flex-direction: column;
  background: var(--surface); border-left: 1px solid var(--line);
  overflow-y: auto; transition: width 180ms var(--ease-out);
}
.inspector.collapsed { width: 0 !important; border-left: none; overflow: hidden; }
.insp-hd { padding: 12px 14px; border-bottom: 1px solid var(--line); }
.insp-fn {
  font-family: var(--mono); font-size: 13px; font-weight: 600; color: var(--fg);
  word-break: break-all; line-height: 1.35;
}
.insp-meta {
  display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
  margin-top: 6px; font-family: var(--mono); font-size: 11px; color: var(--fg-3);
}
.pill-badge {
  font-family: var(--sans); font-size: 10.5px; font-weight: 500;
  padding: 1px 6px; border-radius: 99px;
}
.pill-badge.exp { background: var(--green-soft); color: var(--green); }
.pill-badge.cross { background: var(--violet-soft); color: var(--violet); }
.pill-badge.plt { background: var(--surface-3); color: var(--fg-3); }

.insp-sec { padding: 12px 14px; border-bottom: 1px solid var(--line); }
.insp-sec-title {
  display: flex; align-items: center; justify-content: space-between;
  font-size: 12px; font-weight: 600; color: var(--fg); margin-bottom: 8px;
}
.insp-sec-title .cnt { font-family: var(--mono); font-size: 11px; font-weight: 500; color: var(--fg-3); }
.kv-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
.kv-box {
  padding: 6px 8px; border-radius: 6px; background: var(--surface-2);
  border: 1px solid var(--line);
}
.kv-box .k { font-size: 10.5px; color: var(--fg-3); }
.kv-box .v { font-family: var(--mono); font-size: 12.5px; font-weight: 600; color: var(--fg); margin-top: 2px; }

.xref-row {
  display: flex; align-items: center; gap: 6px;
  padding: 5px 7px; border-radius: var(--radius-sm); cursor: pointer;
  font-family: var(--mono); font-size: 11.5px;
  transition: background 110ms;
}
.xref-row:hover { background: var(--surface-hover); }
.xref-row .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--fg); }
.xref-row .ad { color: var(--fg-3); font-size: 10.5px; }

.str-chip {
  padding: 5px 8px; border-radius: 5px; background: var(--surface-2);
  border: 1px solid var(--line); font-family: var(--mono); font-size: 11px;
  color: var(--c-str); margin-bottom: 5px; cursor: pointer;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.str-chip:hover { border-color: var(--c-str); }

/* ════════ 底部状态栏 ════════ */
.statusbar {
  height: 24px; flex: 0 0 24px; padding: 0 12px;
  display: flex; align-items: center; gap: 14px;
  background: var(--surface); border-top: 1px solid var(--line);
  font-size: 11px; color: var(--fg-3);
}
.statusbar .r { margin-left: auto; display: flex; align-items: center; gap: 12px; }
.status-ok { color: var(--green); display: inline-flex; align-items: center; gap: 5px; }

/* ════════ ⌘K 全局命令面板 ════════ */
.palette-backdrop {
  position: fixed; inset: 0; z-index: 100;
  background: rgba(5, 8, 15, 0.56); backdrop-filter: blur(4px);
  display: none; align-items: flex-start; justify-content: center;
  padding-top: 12vh;
}
.palette-backdrop.open { display: flex; }
.palette {
  width: min(600px, 92vw); max-height: 68vh;
  border-radius: var(--radius-lg); background: var(--surface);
  box-shadow: var(--shadow-lg); overflow: hidden;
  display: flex; flex-direction: column;
  animation: popIn 160ms var(--ease-out);
}
@keyframes popIn {
  from { opacity: 0; transform: translateY(-8px) scale(0.985); }
  to { opacity: 1; transform: none; }
}
.palette-in {
  height: 44px; padding: 0 14px; display: flex; align-items: center; gap: 10px;
  border-bottom: 1px solid var(--line);
}
.palette-in input {
  flex: 1; border: none; background: transparent; color: var(--fg);
  font-size: 14px; outline: none; font-family: var(--sans);
}
.palette-list { flex: 1; overflow-y: auto; padding: 6px; }
.pal-row {
  display: flex; align-items: center; gap: 10px;
  padding: 7px 10px; border-radius: 6px; cursor: pointer;
}
.pal-row:hover, .pal-row.active { background: var(--accent-soft); }
.pal-kind {
  font-size: 10.5px; padding: 1px 6px; border-radius: 4px;
  background: var(--surface-3); color: var(--fg-2); flex: 0 0 46px; text-align: center;
}
.pal-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--mono); font-size: 12px; color: var(--fg); }
.pal-meta { font-family: var(--mono); font-size: 11px; color: var(--fg-3); }

/* ════════ 轻量 Toast ════════ */
.toast {
  position: fixed; bottom: 36px; left: 50%; transform: translateX(-50%) translateY(10px);
  z-index: 120; padding: 7px 14px; border-radius: 8px;
  background: var(--surface-3); color: var(--fg); border: 1px solid var(--line-strong);
  box-shadow: var(--shadow-sm); font-size: 12px;
  opacity: 0; pointer-events: none; transition: all 180ms var(--ease-out);
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

.inline-modal {

}
.inline-modal.open { display: flex; }
.inline-box {
  width: 400px; max-width: 90vw; padding: 16px; border-radius: var(--radius-lg);

}
.inline-box h3 { margin: 0 0 10px; font-size: 14px; font-weight: 600; }
.inline-box input {
  width: 100%; height: 34px; padding: 0 10px; border-radius: 6px;
  border: 1px solid var(--line-strong); background: var(--surface-2);
  color: var(--fg); font-family: var(--mono); font-size: 12.5px; outline: none;
}
.inline-box input:focus { border-color: var(--accent); }
.inline-foot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; }
.btn-pri {

  background: var(--accent); color: var(--accent-fg); font-size: 12px; font-weight: 500; cursor: pointer;
}

/* ════════ 工具函数 ════════ */
const $ = (id) => document.getElementById(id);
const hex = (n) => "0x" + Number(n).toString(16);
const esc = (s) => String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
const fnKey = (so, addr) => `${so}:${hex(addr)}`;
const modColor = (so) => so === "liblog.so" ? "var(--accent)" : "var(--violet)";

function getMod(so = state.so) { return MDA_DATA.modules[so]; }
function getFn(so = state.so, addr = state.addr) {
  const m = getMod(so);
  return m.funcs.find((f) => f.addr === addr) || m.funcs[0];
}
function displayName(so, fn) {
  return state.renames[fnKey(so, fn.addr)] || fn.name;
}
function showToast(msg) {
  const el = $("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => el.classList.remove("show"), 2000);
}

/* ════════ 导航与历史栈 ════════ */
function jumpTo(so, addr, pushHist = true) {
  const m = getMod(so);
  if (!m) return;
  let target = m.funcs.find((f) => f.addr === addr) ||
    m.funcs.find((f) => addr >= f.addr && addr < f.addr + Math.max(f.size, 4));
  if (!target) {
    // 落到最近函数（热力条点击保证不报失败）
    target = m.funcs.reduce((best, cur) =>
      Math.abs(cur.addr - addr) < Math.abs(best.addr - addr) ? cur : best, m.funcs[0]);
  }
  state.so = so;
  state.addr = target.addr;
  state.selInsnAddr = addr >= target.addr && addr < target.addr + target.size ? addr : target.addr;
  state.syncAddr = state.selInsnAddr;
  if (pushHist) {
    const cur = state.history[state.histIdx];
    if (!cur || cur.so !== so || cur.addr !== target.addr) {
      state.history = state.history.slice(0, state.histIdx + 1);
      state.history.push({ so, addr: target.addr });
      state.histIdx = state.history.length - 1;
    }
  }
  // 重置 CFG 视口居中
  state.canvas.cfg = { x: 36, y: 24, scale: 0.92 };
  renderAll();
}

function goBack() {
  if (state.histIdx <= 0) return;
  state.histIdx--;
  const h = state.history[state.histIdx];
  jumpTo(h.so, h.addr, false);
}
function goFwd() {
  if (state.histIdx >= state.history.length - 1) return;
  state.histIdx++;
  const h = state.history[state.histIdx];
  jumpTo(h.so, h.addr, false);
}

/* ════════ 顶栏与热力条 ════════ */
function renderTopbar() {
  const pills = $("modPills");
  pills.innerHTML = Object.keys(MDA_DATA.modules).map((name) => {
    const m = MDA_DATA.modules[name];
    const active = name === state.so ? " active" : "";
    return `<button class="mod-pill${active}" data-so="${esc(name)}">
      <span class="mod-dot" style="background:${modColor(name)}"></span>
      <span>${esc(name)}</span>
      <span class="cnt">${m.totalFuncs}</span>
    </button>`;
  }).join("");
  pills.querySelectorAll(".mod-pill").forEach((b) => {
    b.onclick = () => {
      const s = b.dataset.so;
      const m = getMod(s);
      jumpTo(s, m.defaultAddr || m.funcs[0].addr);
    };
  });

  const fn = getFn();
  $("cmdCrumb").innerHTML = `${esc(state.so)} <span>/</span> ${esc(displayName(state.so, fn))} <span>@ ${hex(fn.addr)}</span>`;
  $("btnBack").disabled = state.histIdx <= 0;
  $("btnFwd").disabled = state.histIdx >= state.history.length - 1;
  $("statusAddr").textContent = `${state.so} · ${hex(state.selInsnAddr || fn.addr)} (${fn.size} B)`;

  const totalMods = Object.keys(MDA_DATA.modules).length;
  const totalFns = Object.values(MDA_DATA.modules).reduce((acc, m) => acc + m.totalFuncs, 0);
  $("statusStats").textContent = `${totalMods} 模块 · ${totalFns} 函数`;

  const bpKey = fnKey(state.so, fn.addr);
  const hasBp = state.breakpoints.has(bpKey);
  $("btnBp").classList.toggle("armed", hasBp);
  $("btnBp").innerHTML = `${hasBp ? "已设断点" : "断点"} <span class="kbd">B</span>`;

  const aiPill = $("btnAiPill");
  aiPill.classList.toggle("following", state.followAi);
  aiPill.classList.toggle("busy", state.replayingAi);
  $("aiPillText").textContent = state.replayingAi
    ? "AI 操控设备中…"
    : (state.followAi ? "AI 同屏 · 跟随开" : "AI 同屏 · 跟随关");

  const demoBtn = $("btnDemoOps");
  if (demoBtn) {
    demoBtn.classList.toggle("running", state.replayingAi);
    demoBtn.classList.toggle("pri", !state.replayingAi);
    demoBtn.textContent = state.replayingAi ? "■ 停止演示" : "⚡ 演示操控特效";
  }
  const lb = $("liveBadge");
  if (lb) lb.textContent = String(state.liveEvents.length);
  const tb = $("toolsBadge");
  if (tb && MDA_DATA.toolsCatalog) tb.textContent = String(MDA_DATA.toolsCatalog.length);
}

function renderHeatmap() {
  const m = getMod();
  const hb = m.heatmap;
  const maxC = Math.max(1, ...hb.buckets.map((b) => b.count));
  const bars = $("heatBars");
  const span = Math.max(1, hb.hi - hb.lo);
  const ratio = Math.max(0, Math.min(1, (state.addr - hb.lo) / span));

  bars.innerHTML = hb.buckets.map((b, i) => {
    const r = b.count / maxC;
    const col = b.count === 0 ? "var(--hot-0)"
      : r < 0.25 ? "var(--hot-1)"
      : r < 0.55 ? "var(--hot-2)"
      : r < 0.8 ? "var(--hot-3)"
      : "var(--hot-4)";
    return `<div class="heat-bar" data-idx="${i}" style="background:${col}"></div>`;
  }).join("") + `<div class="heat-cursor" style="left:calc(${(ratio * 100).toFixed(2)}% - 1px)"></div><div class="heat-sweep" id="heatSweep"></div>`;
  $("heatRange").textContent = `${hex(hb.lo)} → ${hex(hb.hi)} · ${m.totalFuncs} 函数`;

  const tip = $("heatTip");
  bars.querySelectorAll(".heat-bar").forEach((bar) => {
    const b = hb.buckets[Number(bar.dataset.idx)];
    bar.onmouseenter = (e) => {
      tip.textContent = `${hex(b.lo)}–${hex(b.hi)} · 引用强度 ${b.count} · 点击跳转`;
      tip.style.left = Math.min(window.innerWidth - 260, e.clientX + 10) + "px";
      tip.style.top = (e.clientY + 14) + "px";
      tip.classList.add("show");
    };
    bar.onmouseleave = () => tip.classList.remove("show");
    bar.onclick = () => jumpTo(state.so, b.lo);
  });
}

/* ════════ 左栏渲染 ════════ */
function renderLeft() {
  $("leftSeg").querySelectorAll("button").forEach((b) => {
    b.classList.toggle("on", b.dataset.tab === state.leftTab);
  });
  const m = getMod();
  const kw = state.leftFilter.trim().toLowerCase();
  const box = $("leftList");

  if (state.leftTab === "funcs") {
    const list = m.funcs.filter((f) => {
      const nm = displayName(state.so, f).toLowerCase();
      return !kw || nm.includes(kw) || hex(f.addr).includes(kw);
    });
    box.innerHTML = list.map((f) => {
      const sel = f.addr === state.addr ? " sel" : "";
      const exp = f.isExport ? " exp" : "";
      const hasBp = state.breakpoints.has(fnKey(state.so, f.addr));
      return `<div class="fn-item${sel}${exp}" data-addr="${f.addr}">
        ${hasBp ? '<span class="bp-pip" title="已设断点"></span>' : ""}
        <span class="fn-nm" title="${esc(displayName(state.so, f))}">${esc(displayName(state.so, f))}</span>
        <span class="fn-addr">${hex(f.addr)}</span>
        <span class="fn-ref" title="引用数">${f.refs || ""}</span>
      </div>`;
    }).join("") || `<div style="padding:18px;color:var(--fg-3);text-align:center">无匹配函数</div>`;
    box.querySelectorAll(".fn-item").forEach((el) => {
      el.onclick = () => jumpTo(state.so, Number(el.dataset.addr));
    });
    box.querySelector(".fn-item.sel")?.scrollIntoView({ block: "nearest" });
  } else if (state.leftTab === "strings") {
    const list = m.strings.filter((s) => !kw || s.value.toLowerCase().includes(kw) || hex(s.addr).includes(kw));
    box.innerHTML = list.map((s) => `
      <div class="str-item" data-ref="${s.refFn ?? ""}" data-addr="${s.addr}">
        <div class="str-val">"${esc(s.value)}"</div>
        <div class="str-meta"><span>${hex(s.addr)} · ${esc(s.section)}</span><span>${s.refCount} 引用</span></div>
      </div>`).join("") || `<div style="padding:18px;color:var(--fg-3);text-align:center">无匹配字符串</div>`;
    box.querySelectorAll(".str-item").forEach((el) => {
      el.onclick = () => {
        const ref = el.dataset.ref;
        if (ref) {
          jumpTo(state.so, Number(ref));
          showToast(`已跳至引用该字符串的函数 ${hex(Number(ref))}`);
        } else {
          showToast(`字符串地址 ${hex(Number(el.dataset.addr))}`);
        }
      };
    });
  } else {
    const list = m.sections.filter((s) => !kw || s.name.toLowerCase().includes(kw));
    box.innerHTML = list.map((s) => {
      const cls = s.flags.includes("x") ? " exec" : s.flags.includes("w") ? " rw" : "";
      return `<div class="sec-item">
        <span class="sec-perm${cls}">${esc(s.flags)}</span>
        <span style="flex:1;color:var(--fg);overflow:hidden;text-overflow:ellipsis">${esc(s.name)}</span>
        <span style="color:var(--fg-3)">${hex(s.addr)}</span>
      </div>`;
    }).join("");
  }
}

/* ════════ ARM64 语法高亮与交互渲染 ════════ */
function classifyMnem(mnem) {
  const m = mnem.toLowerCase();
  if (m === "bl" || m === "blr") return "k-call";
  if (m === "ret" || m === "retaa" || m === "retab") return "k-ret";
  if (m === "b" || m === "br" || m.startsWith("b.") || m.startsWith("cb") || m.startsWith("tb")) return "k-branch";
  if (m.startsWith("ld") || m.startsWith("st") || m === "adrp" || m === "adr") return "k-mem";
  return "";
}

function highlightOperands(ops, targetAddr, targetSo) {
  // 单遍分词器，避免二次正则替换污染 HTML 属性
  const re = /(#-?0x[0-9a-fA-F]+|#-?\d+|\b(?:[xwsdqv]\d+|sp|fp|lr|xzr|wzr)\b)/g;
  let out = "", last = 0, m;
  while ((m = re.exec(ops)) !== null) {
    out += esc(ops.slice(last, m.index));
    const tok = m[0];
    if (tok[0] === "#") {
      if (targetAddr !== null && targetAddr !== undefined && tok.includes("0x")) {
        out += `<span class="tok-target" data-jump-so="${esc(targetSo || state.so)}" data-jump-addr="${targetAddr}">${esc(tok)}</span>`;
      } else {
        out += `<span class="tok-imm">${esc(tok)}</span>`;
      }
    } else {
      out += `<span class="tok-reg">${esc(tok)}</span>`;
    }
    last = re.lastIndex;
  }
  return out + esc(ops.slice(last));
}

function buildDisasmPane(fn) {
  const det = getMod().details[hex(fn.addr)];
  if (!det) {
    return `<div class="code-pane"><div class="pane-hd"><strong>反汇编</strong></div>
      <div style="padding:24px;color:var(--fg-3)">点击左栏带有详细反汇编的函数（或切换到带源码的函数）查看指令。</div></div>`;
  }
  const rowsHtml = det.insns.map((ins) => {
    const parts = ins.text.split(/\s+/);
    const mnem = parts[0] || "";
    const ops = ins.text.slice(mnem.length).trim();
    const mk = classifyMnem(mnem);
    const userCmt = state.comments[fnKey(state.so, ins.addr)];
    const hasBp = state.breakpoints.has(fnKey(state.so, ins.addr));
    const sel = state.selInsnAddr === ins.addr ? " sel" : "";
    const sync = state.syncAddr === ins.addr ? " sync-hi" : "";
    let cmtHtml = "";
    if (userCmt) {
      cmtHtml = `<span class="insn-cmt is-user">; ${esc(userCmt)}</span>`;
    } else if (ins.strRef) {
      cmtHtml = `<span class="insn-cmt is-str" title="${esc(ins.strRef)}">; "${esc(ins.strRef)}"</span>`;
    } else if (ins.symRef) {
      cmtHtml = `<span class="insn-cmt" title="${esc(ins.symRef)}">; → ${esc(ins.symRef)}</span>`;
    }
    return `<div class="insn-row${sel}${sync}${hasBp ? " has-bp" : ""}" data-iaddr="${ins.addr}">
      <span class="insn-bp" title="点击切换指令断点">●</span>
      <span class="insn-addr">${hex(ins.addr)}</span>
      <span class="insn-bytes">${esc(ins.bytes)}</span>
      <span class="insn-mnem ${mk}">${esc(mnem)}</span>
      <span class="insn-ops">${highlightOperands(ops, ins.jumpAddr, ins.jumpSo)}</span>
      ${cmtHtml}
    </div>`;
  }).join("");

  return `<div class="code-pane">
    <div class="pane-hd">
      <strong>ARM64 反汇编</strong>
      <span class="tag">${det.insns.length} 条</span>
      <span class="tag">${fn.size} B</span>
      <span class="pane-hint">点击蓝色目标跳转 · 圆点设断点</span>
    </div>
    <div class="pane-scroll" id="disasmScroll">
      <div class="fn-banner">
        <div class="sig">${esc(displayName(state.so, fn))}()</div>
        <div class="sub">${esc(state.so)} · ${hex(fn.addr)}..${hex(fn.addr + fn.size)} · ${fn.isExport ? "导出函数" : "内部函数"} · ${det.cfg.length} 个基本块</div>
      </div>
      ${rowsHtml}
    </div>
  </div>`;
}

function highlightPseudo(code) {
  // 单遍伪代码语法高亮，注释与字符串内部不被关键词误染色
  const re = /(\/\*[\s\S]*?\*\/|\/\/.*$|"(?:\\.|[^"\\])*"|\b(?:void|if|else|return|while|for|int|uint64_t|uint32_t|char|bool)\b|\b0x[0-9a-fA-F]+\b)/g;
  let out = "", last = 0, m;
  while ((m = re.exec(code)) !== null) {
    out += esc(code.slice(last, m.index));
    const tok = m[0];
    if (tok.startsWith("//") || tok.startsWith("/*")) {
      out += `<span class="pc-cmt">${esc(tok)}</span>`;
    } else if (tok.startsWith('"')) {
      out += `<span class="pc-str">${esc(tok)}</span>`;
    } else if (tok.startsWith("0x")) {
      out += `<span class="pc-num">${esc(tok)}</span>`;
    } else {
      out += `<span class="pc-kw">${esc(tok)}</span>`;
    }
    last = re.lastIndex;
  }
  return out + esc(code.slice(last));
}

function buildPseudoPane(fn) {
  const det = getMod().details[hex(fn.addr)];
  if (!det) return "";
  const lines = det.pseudocode.split("\n");
  const html = lines.map((ln) => {
    const m = ln.match(/\/\/\s*(0x[0-9a-fA-F]+)\s+(.*)$/);
    const srcAddr = m ? parseInt(m[1], 16) : null;
    const body = m ? "    " + m[2] : ln;
    const sync = srcAddr !== null && state.syncAddr === srcAddr ? " sync-hi" : "";
    return `<div class="pc-line${sync}" ${srcAddr !== null ? `data-paddr="${srcAddr}"` : ""}>
      <span class="pc-src">${srcAddr !== null ? hex(srcAddr) : ""}</span>
      <span class="pc-code">${highlightPseudo(body)}</span>
    </div>`;
  }).join("");

  return `<div class="code-pane">
    <div class="pane-hd">
      <strong>伪代码对照 (F5)</strong>
      <span class="tag">源地址同步</span>
      <span class="pane-hint">悬停/点击联动高亮左侧汇编</span>
    </div>
    <div class="pane-scroll" id="pseudoScroll">${html}</div>
  </div>`;
}

function bindCodeInteractions() {
  const stage = $("stageBody");
  stage.querySelectorAll(".insn-row").forEach((row) => {
    const a = Number(row.dataset.iaddr);
    row.onmouseenter = () => syncHighlight(a, false);
    row.onclick = (e) => {
      if (e.target.classList.contains("tok-target")) {
        const jso = e.target.dataset.jumpSo || state.so;
        const jaddr = Number(e.target.dataset.jumpAddr);
        jumpTo(jso, jaddr);
        return;
      }
      if (e.target.classList.contains("insn-bp")) {
        toggleBpAt(a);
        return;
      }
      state.selInsnAddr = a;
      syncHighlight(a, true);
      $("statusAddr").textContent = `${state.so} · ${hex(a)}`;
    };
  });

  stage.querySelectorAll(".pc-line[data-paddr]").forEach((line) => {
    const a = Number(line.dataset.paddr);
    line.onmouseenter = () => syncHighlight(a, false);
    line.onclick = () => {
      state.selInsnAddr = a;
      syncHighlight(a, true);
      const targetRow = stage.querySelector(`.insn-row[data-iaddr="${a}"]`);
      if (targetRow) targetRow.scrollIntoView({ block: "center", behavior: "smooth" });
    };
  });
}

function syncHighlight(addr, updateSel) {
  state.syncAddr = addr;
  document.querySelectorAll(".insn-row").forEach((r) => {
    const ra = Number(r.dataset.iaddr);
    r.classList.toggle("sync-hi", ra === addr);
    if (updateSel) r.classList.toggle("sel", ra === state.selInsnAddr);
  });
  document.querySelectorAll(".pc-line[data-paddr]").forEach((p) => {
    p.classList.toggle("sync-hi", Number(p.dataset.paddr) === addr);
  });
}

/* ════════ CFG 控制流图（可缩放、可拖拽、真实基本块） ════════ */
function renderCfgView(fn) {
  const det = getMod().details[hex(fn.addr)];
  const rawBlocks = det ? det.cfg : [];
  // 无损复原每个基本块的真实指令列表（避免 JSON 中重复存储指令文本）
  const blocks = rawBlocks.map((b) => ({
    ...b,
    insns: b.insns || det.insns.filter((i) => i.addr >= b.start && i.addr < (b.end || (b.start + 4)))
  }));
  if (!blocks.length) {
    $("stageBody").innerHTML = `<div style="padding:32px;color:var(--fg-3)">该函数暂无 CFG 数据。</div>`;
    return;
  }

  // BFS 确定性分层布局（绝不随机乱跳）
  const byAddr = new Map(blocks.map((b) => [b.start, b]));
  const depth = new Map([[blocks[0].start, 0]]);
  const q = [blocks[0].start];
  while (q.length) {
    const u = q.shift();
    const d = depth.get(u);
    const blk = byAddr.get(u);
    if (!blk) continue;
    for (const s of blk.succ) {
      if (byAddr.has(s.target) && !depth.has(s.target)) {
        depth.set(s.target, d + 1);
        q.push(s.target);
      }
    }
  }
  blocks.forEach((b) => { if (!depth.has(b.start)) depth.set(b.start, 0); });

  const layers = new Map();
  blocks.forEach((b) => {
    const d = depth.get(b.start);
    if (!layers.has(d)) layers.set(d, []);
    layers.get(d).push(b);
  });

  const BW = 276;
  const GAP_X = 36;
  const GAP_Y = 48;
  const pos = new Map();
  let curY = 24;
  [...layers.keys()].sort((a, b) => a - b).forEach((d) => {
    const row = layers.get(d);
    const totalW = row.length * BW + (row.length - 1) * GAP_X;
    let startX = Math.max(24, (960 - totalW) / 2);
    let maxH = 0;
    row.forEach((b) => {
      const shown = b.insns.slice(0, 7);
      const h = 30 + shown.length * 16 + (b.insns.length > 7 ? 16 : 6);
      pos.set(b.start, { x: startX, y: curY, w: BW, h, blk: b, shown });
      startX += BW + GAP_X;
      maxH = Math.max(maxH, h);
    });
    curY += maxH + GAP_Y;
  });

  let edgesSvg = "";
  pos.forEach((p) => {
    p.blk.succ.forEach((s) => {
      const dst = pos.get(s.target);
      if (!dst) return;
      const x1 = p.x + p.w / 2;
      const y1 = p.y + p.h;
      const x2 = dst.x + dst.w / 2;
      const y2 = dst.y;
      const isBack = y2 <= y1;
      const isTrue = s.kind === "branch" || s.kind === "true";
      const isFalse = s.kind === "fallthrough" || s.kind === "false";
      const col = isTrue ? "var(--green)"
        : isFalse ? "var(--rose)"
        : "var(--accent)";
      const marker = isTrue ? "url(#arrGreen)"
        : isFalse ? "url(#arrRose)"
        : "url(#arrBlue)";
      let pathD;
      if (isBack) {
        const sideX = Math.max(p.x + p.w, dst.x + dst.w) + 28;
        pathD = `M ${x1} ${y1} C ${x1} ${y1 + 24}, ${sideX} ${y1 + 24}, ${sideX} ${(y1 + y2) / 2} S ${x2} ${y2 - 24}, ${x2} ${y2}`;
      } else {
        const midY = (y1 + y2) / 2;
        pathD = `M ${x1} ${y1} C ${x1} ${midY}, ${x2} ${midY}, ${x2} ${y2}`;
      }
      edgesSvg += `<path d="${pathD}" fill="none" stroke="${col}" stroke-width="1.6" stroke-opacity="0.82" marker-end="${marker}"/>`;
    });
  });

  let nodesSvg = "";
  pos.forEach((p, addr) => {
    const isEntry = addr === blocks[0].start;
    const lines = p.shown.map((ins, idx) =>
      `<text class="cfg-ins-addr" x="${p.x + 10}" y="${p.y + 42 + idx * 16}">${hex(ins.addr)}</text>
       <text class="cfg-ins-txt" x="${p.x + 68}" y="${p.y + 42 + idx * 16}">${esc(ins.text.slice(0, 29))}</text>`
    ).join("");
    const more = p.blk.insns.length > 7
      ? `<text class="cfg-ins-addr" x="${p.x + 10}" y="${p.y + 42 + 7 * 16}">… 还有 ${p.blk.insns.length - 7} 条指令</text>` : "";
    nodesSvg += `<g class="cfg-block${isEntry ? " entry" : ""}" data-baddr="${addr}">
